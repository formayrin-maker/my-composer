<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>도전, 나도 작곡가!</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--text:#111}
body{font-family:'맑은 고딕',Arial,sans-serif;margin:14px;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:18px;border-radius:12px;border:1px solid #e6eef8}
h1{color:var(--primary);text-align:center;margin:0 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
select,button,input[type=number]{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;cursor:pointer;font-weight:700}
button.primary{background:var(--primary);color:#fff;border:0}
button.danger{background:#ef4444;color:#fff;border:0}
.note-tools{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.dur-btn{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:700}
.dur-btn.active{background:var(--primary);color:white}
#score-container{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.measure-box{border:1px solid #e2e8f0;border-radius:8px;padding:6px;background:#fff;display:flex;flex-direction:column;align-items:center;min-height:140px;position:relative}
.measure-box > div { touch-action: none; -ms-touch-action: none; } /* 터치/펜 입력용 */
.measure-header{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#556;margin-bottom:6px}
.status{margin-top:8px;padding:8px;border-radius:8px;text-align:center}
.loading{background:#fef08a;color:#854d0e}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.measure-box.active{box-shadow:0 0 0 3px rgba(37,99,235,0.08);border-color:var(--primary)}
.measure-box.dragging{outline:3px dashed rgba(37,99,235,0.18)}
.note-hint{position:absolute;right:8px;top:32px;font-size:12px;color:#777}
</style>

<!-- 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>🎼 도전, 나도 작곡가!</h1>

    <div class="toolbar">
      <label>조성:
        <select id="keySelect">
          <option value="C">다장조 (C)</option>
          <option value="G">사장조 (G)</option>
          <option value="F">바장조 (F)</option>
        </select>
      </label>

      <label>악기:
        <select id="instrSelect">
          <option value="acoustic_grand_piano">피아노</option>
          <option value="flute">플루트</option>
          <option value="acoustic_guitar_nylon">어쿠스틱 기타</option>
          <option value="electric_guitar_clean">일렉 기타</option>
          <option value="violin">바이올린</option>
          <option value="xylophone">실로폰</option>
        </select>
      </label>

      <button id="playBtn" class="primary">▶ 전체 재생</button>
      <button id="stopBtn">■ 정지</button>
      <button id="undoBtn">↩️ 실행 취소</button>
      <button id="clearAllBtn" class="danger">🗑️ 모두 지우기</button>
    </div>

    <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:8px">
      <label>템포: <input id="tempoInput" type="number" value="100" min="40" max="200" style="width:90px"></label>
      <button id="saveJsonBtn" style="background:#10b981;color:white;border:0;font-weight:800">💾 저장</button>
      <button id="loadJsonBtn" style="background:#06b6d4;color:white;border:0;font-weight:800">📂 불러오기</button>
      <input id="fileInput" type="file" accept=".json" style="display:none">
      <button id="exportPngBtn">🖼️ 악보 저장</button>
      <button id="exportMidiBtn" style="background:#f59e0b;color:white;border:0;font-weight:800">🎹 음악 저장</button>
    </div>

    <div class="note-tools">
      <div style="text-align:center">
        <div style="font-weight:800;margin-bottom:6px">음표</div>
        <button class="dur-btn" id="dur_w">온음표 (4박)</button>
        <button class="dur-btn" id="dur_h">2분음표 (2박)</button>
        <button class="dur-btn active" id="dur_q">4분음표 (1박)</button>
        <button class="dur-btn" id="dur_8">8분음표 (반박)</button>
      </div>

      <div style="text-align:center;border-left:1px dashed #e2e8f0;padding-left:12px">
        <div style="font-weight:800;margin-bottom:6px">쉼표</div>
        <button class="dur-btn" id="rest_w">온쉼표 (4박)</button>
        <button class="dur-btn" id="rest_h">2분쉼표 (2박)</button>
        <button class="dur-btn" id="rest_q">4분쉼표 (1박)</button>
        <button class="dur-btn" id="rest_8">8분쉼표 (반박)</button>
      </div>

      <div style="display:flex;flex-direction:column;justify-content:center;border-left:1px dashed #e2e8f0;padding-left:12px">
        <button id="recommendNoteBtn" class="primary" style="margin-bottom:6px">✨ 추천 음표</button>
        <button id="recommendMelodyBtn" class="primary" style="background:#8b5cf6">🎵 추천 멜로디</button>
      </div>
    </div>

    <div id="status" class="status loading">샘플을 온라인에서 불러옵니다 — 재생은 Play 버튼(사용자 클릭)으로 시작하세요.</div>

    <div id="score-container"></div>
  </div>

<script>
// ----------------- 전역 상태(항상 최상단에) -----------------
let selectedDur = 'q';
let selectedIsRest = false;
let isPointerDown = false;

const AUTOSAVE_KEY = 'composer_sf_online_custom_v_final';
const NUM_MEASURES = 8;
const BEATS_PER_MEASURE = 4;
const beatValue = { w:4, h:2, q:1, '8':0.5 };
const STAVE_MAX = 360;
let tempo = 100;

const measures = Array.from({length:NUM_MEASURES}, ()=>[]);
const history = [];

const SF_BASE = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';
const instrMap = {
  'acoustic_grand_piano':'acoustic_grand_piano','flute':'flute','acoustic_guitar_nylon':'acoustic_guitar_nylon',
  'electric_guitar_clean':'electric_guitar_clean','violin':'violin','xylophone':'xylophone'
};

// 오디오 상태
let synthPrimary = null;
let melodySampler = null;
let samplerReady = false;
let isPlaying = false;

// 상태창 락
let statusLockUntil = 0;
function setStatus(text, cls='ok', force=false){
  const now = Date.now();
  if (!force && now < statusLockUntil) return;
  const s = document.getElementById('status'); s.textContent = text; s.className = 'status ' + cls;
}
function flashError(msg){
  const s = document.getElementById('status'); s.textContent = msg; s.className='status err';
  statusLockUntil = Date.now() + 2200;
  setTimeout(()=>{ if (Date.now() >= statusLockUntil) setStatus('작성 계속하세요!', 'ok', true); }, 2300);
}

// synth 초기화
function initSynth(){
  try{ if (synthPrimary) synthPrimary.dispose(); }catch(e){}
  synthPrimary = new Tone.PolySynth(Tone.Synth, {maxPolyphony:8}).toDestination();
  synthPrimary.set({voice:{envelope:{attack:0.01,decay:0.1,sustain:0.9,release:0.2}}});
  setStatus('합성기 준비됨 — Play 버튼을 눌러 오디오 활성화', 'ok', true);
}
initSynth();

// 안전한 재생 헬퍼 (항상 사용)
function playByName(name, durSec, when=Tone.now()){
  try{
    if (samplerReady && window.melodySampler) window.melodySampler.triggerAttackRelease(name, durSec, when);
    else if (synthPrimary) synthPrimary.triggerAttackRelease(name, durSec, when);
  }catch(e){
    try{ synthPrimary && synthPrimary.triggerAttackRelease(name, durSec, when); }catch(_){}
  }
}

// ----------------- 샘플 파일 검사/로딩 (최적화된 흐름) -----------------
async function findWorkingSampleFilename(baseUrl, note){
  const tryNames = [];
  tryNames.push(note + '.mp3');
  tryNames.push(encodeURIComponent(note) + '.mp3');
  const sharpToFlat = { 'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb' };
  const flatToSharp = { 'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#' };
  const m = note.match(/^([A-G])([#b]?)(\d)$/);
  if (m){
    const letter = m[1], acc = m[2], oct = m[3];
    const base = letter + acc;
    if (acc === '#'){
      const flat = sharpToFlat[base];
      if (flat){ tryNames.push(flat + oct + '.mp3'); tryNames.push(encodeURIComponent(flat + oct) + '.mp3'); }
    } else if (acc === 'b'){
      const sharp = flatToSharp[base];
      if (sharp){ tryNames.push(sharp + oct + '.mp3'); tryNames.push(encodeURIComponent(sharp + oct) + '.mp3'); }
    }
  }
  for (const fn of tryNames){
    const url = baseUrl + fn;
    try{
      const r = await fetch(url, { method: 'HEAD' });
      if (r && (r.status === 200 || r.status === 0)) return fn;
    }catch(e){
      try{
        const r2 = await fetch(url, { method: 'GET' });
        if (r2 && r2.status === 200) return fn;
      }catch(_){}
    }
  }
  return null;
}

// notes: ["C4","G#4",...]
async function buildSamplerMappingForNotes(baseUrl, notes){
  const mapping = {};
  const concurrency = 6;
  for (let i=0;i<notes.length;i+=concurrency){
    const batch = notes.slice(i, i+concurrency);
    await Promise.all(batch.map(async note=>{
      try{
        const fn = await findWorkingSampleFilename(baseUrl, note);
        if (fn) mapping[note] = fn;
      }catch(e){ console.warn('check failed', note, e); }
    }));
  }
  return mapping;
}

async function loadSamplerForInstrument(instrValue, noteList){
  samplerReady = false;
  if (melodySampler){ try{ melodySampler.dispose(); }catch(e){} melodySampler=null; samplerReady=false; window.samplerReady=false; }
  const folder = instrMap[instrValue] || instrMap['acoustic_grand_piano'];
  const baseUrl = SF_BASE + folder + '-mp3/';
  try{
    setStatus('필요한 샘플 확인 중...', 'loading', true);
    const urls = await buildSamplerMappingForNotes(baseUrl, noteList);
    if (!urls || Object.keys(urls).length === 0){
      setStatus('해당 악기의 샘플을 찾지 못했습니다 — 합성기 폴백', 'err', true);
      return;
    }
    setStatus('샘플 로드 중...', 'loading', true);
    melodySampler = new Tone.Sampler({
      urls,
      baseUrl,
      onload: ()=>{ samplerReady = true; window.samplerReady = true; setStatus('샘플 준비 완료 — 실제 음색으로 재생', 'ok', true); },
      onerror: (err)=>{ console.warn('sampler error', err); setStatus('샘플 로드 중 일부 실패 — 합성기 폴백', 'err', true); }
    }).toDestination();
    window.melodySampler = melodySampler;
  }catch(err){
    console.warn('loadSamplerForInstrument error', err);
    setStatus('샘플 초기화 실패 — 합성기로 재생', 'err', true);
  }
}

// stop: sampler는 보관(즉시 dispose하지 않음) -> 다음 재생에 재사용 가능
function stopAllAudio(){
  try{ Tone.Transport.cancel(); }catch(e){}
  try{ if (synthPrimary){ synthPrimary.releaseAll(); synthPrimary.dispose(); } }catch(e){}
  initSynth();
  isPlaying = false;
  setStatus('오디오 정지됨', 'ok', true);
}

// ----------------- VexFlow 렌더 / 입력 (클릭=추가, 드래그=높이 변경) -----------------
const VF = Vex.Flow;
const scoreContainer = document.getElementById('score-container');

function renderAll(){
  scoreContainer.innerHTML = '';
  const key = document.getElementById('keySelect').value;
  const wrap = document.querySelector('.wrap');
  const wrapW = Math.min(wrap.clientWidth, 1100);
  const cols = 4, gap = 12;
  const measureOuter = Math.floor((wrapW - (cols - 1) * gap) / cols);
  const staveWidth = Math.max(120, Math.min(STAVE_MAX, measureOuter - 16));
  const availableWidth = Math.max(40, Math.floor(staveWidth * 0.66));

  for (let i=0;i<NUM_MEASURES;i++){
    try{
      const box = document.createElement('div'); box.className='measure-box';
      const header = document.createElement('div'); header.className='measure-header';
      header.innerHTML = `<span>${i+1}마디</span><button onclick="clearMeasure(${i})">🗑️</button>`;
      box.appendChild(header);

      const div = document.createElement('div'); div.style.width=(staveWidth+20)+'px'; div.style.height='160px';
      box.appendChild(div);

      const hint = document.createElement('div'); hint.className='note-hint'; hint.textContent='(빈칸 클릭 = 추가 · 음표 클릭→드래그 = 높이 변경)';
      box.appendChild(hint);

      scoreContainer.appendChild(box);

      const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
      renderer.resize(staveWidth+20,160);
      const ctx = renderer.getContext();
      const stave = new VF.Stave(10,28,staveWidth);
      if (i===0) stave.addClef('treble').addTimeSignature('4/4');
      stave.addKeySignature(vexKeys[key]);
      stave.setContext(ctx).draw();

      const notes = measures[i].map(n=>{
        const k = n.isRest ? 'b/4' : noteToVexKey(n.pitch);
        const d = n.isRest ? (n.duration + 'r') : n.duration;
        return new VF.StaveNote({ clef:'treble', keys:[k], duration: d, auto_stem:true });
      });

      const voice = new VF.Voice({ num_beats: BEATS_PER_MEASURE, beat_value:4 }); voice.setStrict(false);
      if (notes.length > 0){ voice.addTickables(notes); new VF.Formatter().joinVoices([voice]).format([voice], availableWidth); voice.draw(ctx, stave); }
      else { const placeholder=[ new VF.StaveNote({ clef:'treble', keys:['b/4'], duration:'wr' }) ]; const v2=new VF.Voice({num_beats:4,beat_value:4}); v2.setStrict(false); v2.addTickables(placeholder); new VF.Formatter().joinVoices([v2]).format([v2], availableWidth); v2.draw(ctx, stave); }

      // pointer events: pointer capture + passive:false 옵션으로 터치/펜 지원 강화
      div.addEventListener('pointerdown', async function(ev){
        ev.preventDefault();
        // 포인터 캡처 시도
        try{ this.setPointerCapture(ev.pointerId); }catch(e){}
        for (let p=0;p<i;p++){
          const sum = measures[p].reduce((s,n)=>s+n.beats,0);
          if (sum < BEATS_PER_MEASURE){ flashError(`먼저 ${p+1}마디를 모두 채워주세요.`); try{ this.releasePointerCapture(ev.pointerId); }catch(e){} return; }
        }
        isPointerDown = true;
        try{ await Tone.start(); if (Tone.context && Tone.context.state === 'suspended') await Tone.context.resume(); }catch(e){ console.warn('Tone.start/resume:', e); }
        handlePointerDown(ev, i, div);
      }, { passive: false });

      div.addEventListener('pointermove', function(ev){ if (isPointerDown) handlePointerMove(ev, i, div); }, { passive: false });

      div.addEventListener('pointerup', function(ev){
        try{ this.releasePointerCapture(ev.pointerId); }catch(e){}
        isPointerDown = false;
        handlePointerUp(ev);
      }, { passive: false });

      div.addEventListener('pointercancel', function(ev){
        try{ this.releasePointerCapture(ev.pointerId); }catch(e){}
        isPointerDown = false;
        handlePointerUp(ev);
      }, { passive: false });

    }catch(err){
      console.error('render error', err);
      setStatus('렌더 오류 발생(콘솔 확인)', 'err', true);
    }
  }
}

// pointer/drag logic
let draggingNote = null;
let lastTime = 0;
let pointerStart = null;

function handlePointerDown(ev, measureIdx, div){
  const rect = div.getBoundingClientRect();
  const x = ev.clientX - rect.left;
  const y = ev.clientY - rect.top;
  pointerStart = { x, y, measureIdx, rect };
}

function handlePointerMove(ev, measureIdx, div){
  const now = Date.now(); if (now - lastTime < 60) return; lastTime = now;
  if (!pointerStart) return;
  const rect = pointerStart.rect;
  const dx = (ev.clientX - (rect.left + pointerStart.x));
  const dy = (ev.clientY - (rect.top + pointerStart.y));
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (!draggingNote && dist > 6){
    if (measures[measureIdx].length > 0){
      const slotWidth = rect.width / measures[measureIdx].length;
      const px = ev.clientX - rect.left;
      let nearestIdx = Math.floor(px / slotWidth);
      nearestIdx = Math.max(0, Math.min(measures[measureIdx].length-1, nearestIdx));
      const centerX = nearestIdx * slotWidth + slotWidth/2;
      if (Math.abs(centerX - px) < Math.max(20, slotWidth*0.5)){
        draggingNote = { measureIdx, noteIdx: nearestIdx, fromPitch: measures[measureIdx][nearestIdx].isRest ? null : measures[measureIdx][nearestIdx].pitch };
        const box = div.parentElement; box.classList.add('dragging');
        return;
      }
    }
  }
  if (draggingNote && draggingNote.measureIdx === measureIdx){
    const rect2 = div.getBoundingClientRect();
    const y2 = ev.clientY - rect2.top;
    const scale = scales[document.getElementById('keySelect').value];
    let slot = Math.floor(((y2 - 30) / (rect2.height - 40)) * scale.length);
    slot = Math.max(0, Math.min(scale.length - 1, slot));
    const noteObj = scale[slot];
    const n = measures[measureIdx][draggingNote.noteIdx];
    if (!n || n.isRest) return;
    if (n.pitch.play !== noteObj.play){
      n.pitch = { display: noteObj.display, play: noteObj.play };
      renderAll();
    }
  }
}

function handlePointerUp(ev){
  if (!draggingNote && pointerStart){
    const measureIdx = pointerStart.measureIdx;
    const rect = pointerStart.rect;
    const y = ev.clientY - rect.top;
    const scale = scales[document.getElementById('keySelect').value];
    let slot = Math.floor(((y - 30) / (rect.height - 40)) * scale.length);
    slot = Math.max(0, Math.min(scale.length - 1, slot));
    const noteObj = scale[slot];
    addNoteToMeasure(measureIdx, noteObj, selectedDur, selectedIsRest);
    pointerStart = null;
    return;
  }
  if (draggingNote){
    const m = measures[draggingNote.measureIdx];
    const idx = draggingNote.noteIdx;
    const newNote = m[idx];
    const from = draggingNote.fromPitch;
    const to = newNote.isRest ? null : newNote.pitch;
    history.push({ type:'move', measure: draggingNote.measureIdx, noteIdx: idx, from: from, to: to });
    const box = document.querySelectorAll('.measure-box')[draggingNote.measureIdx];
    if (box) box.classList.remove('dragging');
    draggingNote = null;
    pointerStart = null;
    autosave();
    renderAll();
    return;
  }
  pointerStart = null;
  draggingNote = null;
}

// add note
function addNoteToMeasure(measureIdx, scaleNoteObj, durKey, isRest){
  const beats = beatValue[durKey];
  const sum = measures[measureIdx].reduce((s,n)=>s+n.beats,0);
  if (sum + beats > BEATS_PER_MEASURE){ flashError(`${measureIdx+1}마디의 박자가 초과됩니다.`); return false; }
  const stored = isRest ? { pitch:null, duration:durKey, beats:beats, isRest:true } : { pitch:{ display: scaleNoteObj.display, play: scaleNoteObj.play }, duration:durKey, beats:beats, isRest:false };
  measures[measureIdx].push(stored);
  history.push({ type:'add', measure: measureIdx });
  if (!isRest){
    const durSec = beats * (60/tempo);
    playByName(stored.pitch.play, durSec, Tone.now());
  }
  autosave(); renderAll(); return true;
}

function clearMeasure(idx){
  if (measures[idx].length===0) return;
  if (!confirm(`${idx+1}마디를 모두 지우시겠습니까?`)) return;
  const prev = JSON.parse(JSON.stringify(measures[idx]));
  measures[idx]=[];
  history.push({ type:'clear', measure: idx, prev: prev });
  autosave(); renderAll();
}

// clearAll: dispose sampler too
document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  if (!confirm('전체 악보를 완전히 지우시겠습니까? (로컬자동저장도 삭제됩니다)')) return;
  const prevAll = JSON.parse(JSON.stringify(measures));
  for (let i=0;i<NUM_MEASURES;i++) measures[i]=[];
  history.push({ type:'clearAll', prev: prevAll });
  try{ localStorage.removeItem(AUTOSAVE_KEY); } catch(e){}
  try{ if (melodySampler){ melodySampler.dispose(); melodySampler=null; samplerReady=false; window.samplerReady=false; } }catch(e){}
  stopAllAudio();
  renderAll();
  setStatus('전체 초기화 완료', 'ok', true);
});

// undo
document.getElementById('undoBtn').addEventListener('click', ()=>{
  const h = history.pop(); if (!h) return;
  if (h.type === 'add') measures[h.measure].pop();
  else if (h.type === 'move'){ const n = measures[h.measure][h.noteIdx]; if (n){ if (h.from === null) n.isRest = true, n.pitch=null; else n.isRest=false, n.pitch = h.from; } }
  else if (h.type === 'clear') measures[h.measure] = h.prev;
  else if (h.type === 'clearAll'){ for (let i=0;i<NUM_MEASURES;i++) measures[i] = h.prev[i] || []; }
  autosave(); renderAll();
});

// duration buttons
function setActiveButtons(){ document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active')); if (selectedIsRest) document.getElementById('rest_'+selectedDur).classList.add('active'); else document.getElementById('dur_'+selectedDur).classList.add('active'); }
['w','h','q','8'].forEach(d=>{ document.getElementById('dur_'+d).addEventListener('click', ()=>{ selectedIsRest=false; selectedDur=d; setActiveButtons(); }); document.getElementById('rest_'+d).addEventListener('click', ()=>{ selectedIsRest=true; selectedDur=d; setActiveButtons(); }); });

// 추천 기능 (간단히 유지)
document.getElementById('recommendNoteBtn').addEventListener('click', ()=>{
  const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
  if (idx < 0){ flashError('모든 마디가 채워졌습니다'); return; }
  const key = document.getElementById('keySelect').value; const scale = scales[key];
  const prev = measures[idx].slice(-1)[0];
  let chosen = scale[Math.floor(Math.random()*scale.length)];
  if (prev && !prev.isRest){
    const prevIndex = scale.findIndex(s=> s.display.s===prev.pitch.display.s && s.display.a===prev.pitch.display.a && s.display.o===prev.pitch.display.o);
    if (prevIndex>=0){ const off = Math.floor(Math.random()*3)-1; chosen = scale[Math.max(0, Math.min(scale.length-1, prevIndex+off))]; }
  }
  selectedIsRest=false; selectedDur='q'; setActiveButtons(); addNoteToMeasure(idx, chosen, 'q', false);
});
document.getElementById('recommendMelodyBtn').addEventListener('click', ()=>{
  const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
  if (idx < 0){ flashError('추천할 빈 마디가 없습니다'); return; }
  const sumAtIdx = measures[idx].reduce((s,n)=>s+n.beats,0);
  if (sumAtIdx !== 0){ flashError('먼저 현재 마디를 모두 채운 후 추천 멜로디를 사용하세요.'); return; }
  for (let i=0;i<idx;i++){ const s = measures[i].reduce((a,n)=>a+n.beats,0); if (s < BEATS_PER_MEASURE){ flashError(`먼저 ${i+1}마디를 모두 채워주세요.`); return; } }
  const patterns = [['q','q','q','q'],['h','q','q'],['q','q','h'],['q','8','8','q']];
  const pat = patterns[Math.floor(Math.random()*patterns.length)];
  measures[idx] = [];
  const key = document.getElementById('keySelect').value; const scale = scales[key];
  let cur = Math.floor(scale.length/2);
  pat.forEach(d=>{ addNoteToMeasure(idx, scale[cur], d, false); const mv = Math.floor(Math.random()*3)-1; cur = Math.max(0, Math.min(scale.length-1, cur+mv)); });
});

// Play: 필요한 음만 로드 시도(타임아웃) 후 재생
document.getElementById('playBtn').addEventListener('click', async ()=>{
  if (isPlaying){ flashError('이미 재생 중입니다. 먼저 정지해 주세요.'); return; }
  tempo = parseInt(document.getElementById('tempoInput').value) || 100;

  // 사용된 음 모음
  const uniq = new Set();
  for (const m of measures) for (const n of m) if (!n.isRest && n.pitch && n.pitch.play) uniq.add(n.pitch.play);
  const usedNotes = Array.from(uniq);

  try{ await Tone.start(); if (Tone.context && Tone.context.state === 'suspended') await Tone.context.resume(); }catch(e){ console.warn('Tone.start/resume:', e); }

  if (usedNotes.length > 0){
    const instr = document.getElementById('instrSelect').value;
    const loadPromise = loadSamplerForInstrument(instr, usedNotes);
    const timeout = new Promise(res=>setTimeout(res, 2200)); // 2.2s 타임아웃
    await Promise.race([loadPromise, timeout]);
  }

  renderAll();
  const bad = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) > BEATS_PER_MEASURE);
  if (bad>=0){ flashError(`${bad+1}마디 박자 초과`); return; }
  isPlaying = true;
  const secPerBeat = 60/tempo; let t = Tone.now() + 0.12;
  for (let m=0;m<NUM_MEASURES;m++){
    Tone.Draw.schedule(()=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.measure-box')[m].classList.add('active'); }, t);
    for (const n of measures[m]){
      if (!n.isRest){
        const pname = n.pitch.play;
        try{
          if (samplerReady && melodySampler) melodySampler.triggerAttackRelease(pname, n.beats * secPerBeat, t);
          else synthPrimary.triggerAttackRelease(pname, n.beats * secPerBeat, t);
        }catch(e){
          try{ synthPrimary.triggerAttackRelease(pname, n.beats * secPerBeat, t); }catch(_){}
        }
      }
      t += n.beats * secPerBeat;
    }
  }
  Tone.Draw.schedule(()=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); isPlaying=false; }, t);
});

// stop
document.getElementById('stopBtn').addEventListener('click', ()=> stopAllAudio());

// 악기 선택시 기존 샘플 해제 (다음 재생에서 새 샘플 로드)
document.getElementById('instrSelect').addEventListener('change', async ()=>{
  try{ if (melodySampler){ melodySampler.dispose(); melodySampler=null; samplerReady=false; window.samplerReady=false; } }catch(e){}
  setStatus('악기 변경됨 — 다음 재생 시 새 샘플 로드', 'loading', true);
});

// 저장/불러오기/PNG/MIDI 및 autosave (기존과 동일)
document.getElementById('saveJsonBtn').addEventListener('click', ()=>{
  const obj = { title:'도전, 나도 작곡가!', key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) };
  const blob = new Blob([JSON.stringify(obj,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href = url; a.download='활동내용.json'; a.click(); URL.revokeObjectURL(url);
});
document.getElementById('loadJsonBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', ev=>{
  const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = ()=>{ try{ const obj = JSON.parse(r.result); if (!obj.measures) throw 'invalid'; for (let i=0;i<NUM_MEASURES && i<obj.measures.length;i++) measures[i]=obj.measures[i]; if (obj.key) document.getElementById('keySelect').value = obj.key; if (obj.tempo) document.getElementById('tempoInput').value = obj.tempo; autosave(); renderAll(); setStatus('불러오기 완료', 'ok', true); } catch(e){ alert('불러오기 실패'); } };
  r.readAsText(f); ev.target.value='';
});

document.getElementById('exportPngBtn').addEventListener('click', async ()=>{
  const svgEls = Array.from(document.querySelectorAll('#score-container .measure-box div svg'));
  if (svgEls.length === 0){ alert('저장할 악보가 없습니다.'); return; }
  const cols = 4;
  const measureW = Math.max(...Array.from(document.querySelectorAll('#score-container .measure-box div')).map(d=>d.clientWidth)) || (STAVE_MAX+20);
  const measureH = Math.max(...Array.from(document.querySelectorAll('#score-container .measure-box div')).map(d=>d.clientHeight)) || 160;
  const gap = 12; const rows = Math.ceil(svgEls.length / cols);
  const canvasW = cols * measureW + (cols - 1) * gap + 40; const canvasH = rows * measureH + (rows - 1) * gap + 40;
  const canvas = document.createElement('canvas'); canvas.width = canvasW; canvas.height = canvasH; const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvasW,canvasH);
  async function svgToImg(svgEl){ const s = new XMLSerializer().serializeToString(svgEl); const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s); return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=url; }); }
  try{
    const imgs=[]; for (const s of svgEls) imgs.push(await svgToImg(s));
    for (let i=0;i<imgs.length;i++){ const col=i%cols, row=Math.floor(i/cols); ctx.drawImage(imgs[i], 20 + col*(measureW+gap), 20 + row*(measureH+gap), measureW, measureH); }
    canvas.toBlob(blob=>{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href = url; a.download='악보.png'; a.click(); URL.revokeObjectURL(url); setStatus('악보 저장 완료', 'ok', true); }, 'image/png');
  }catch(e){ console.error(e); flashError('악보 저장 실패'); }
});

document.getElementById('exportMidiBtn').addEventListener('click', ()=>{
  const totalNotes = measures.reduce((acc,m)=>acc + m.filter(n=>!n.isRest).length, 0);
  if (totalNotes === 0){ alert('저장할 음원이 없습니다.'); return; }
  try{
    const midi = new Midi(); const track = midi.addTrack(); const tempoVal = parseInt(document.getElementById('tempoInput').value) || 100; midi.header.setTempo(tempoVal);
    let currentTime = 0; const secPerBeat = 60/tempoVal;
    for (let m=0;m<NUM_MEASURES;m++){
      for (const n of measures[m]){
        const durSec = n.beats * secPerBeat;
        if (!n.isRest) track.addNote({ name: n.pitch.play, time: currentTime, duration: durSec, velocity: 0.9 });
        currentTime += durSec;
      }
    }
    const midiData = midi.toArray(); const blob = new Blob([midiData], { type:'audio/midi' }); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href = url; a.download = '나의_음악.mid'; a.click(); URL.revokeObjectURL(url);
    setStatus('음악 저장 완료 (MIDI 생성됨)', 'ok', true);
  }catch(e){ console.error(e); flashError('음악 저장 실패'); }
});

// autosave/load
function autosave(){ try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) })); }catch(e){} }
function loadAutosave(){ try{ const s=localStorage.getItem(AUTOSAVE_KEY); if (!s) return; const obj = JSON.parse(s); if (obj.measures){ for (let i=0;i<NUM_MEASURES && i<obj.measures.length;i++) measures[i]=obj.measures[i]; } if (obj.key) document.getElementById('keySelect').value = obj.key; if (obj.tempo) document.getElementById('tempoInput').value = obj.tempo; }catch(e){} }
loadAutosave();

// VexFlow helper (scale builder)
const semitoneMaster = (function(){ const arr=[]; const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; for (let o=6;o>=4;o--) for (const n of names) arr.push(n+o); return arr; })();
function buildScaleForKey(key){
  const tonicMap = {C:0,G:7,F:5};
  const pcMap = {'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11};
  const diatonic=[0,2,4,5,7,9,11]; const t = tonicMap[key]; const out=[];
  for (const nm of semitoneMaster){
    const namePart = nm.slice(0,-1); const oct = parseInt(nm.slice(-1),10); const pc = pcMap[namePart];
    const rel = (pc - t + 12) % 12;
    if (diatonic.includes(rel)){
      let disp, play;
      if (key==='G' && pc===6){ disp='F#'; play='F#'; }
      else if (key==='F' && pc===10){ disp='Bb'; play='A#'; }
      else { const nat={0:'C',2:'D',4:'E',5:'F',7:'G',9:'A',11:'B'}; if (nat[pc] !== undefined){ disp=nat[pc]; play=nat[pc]; } else { const sharp={1:'C#',3:'D#',6:'F#',8:'G#',10:'A#'}; disp=sharp[pc]; play=sharp[pc]; } }
      const letter = disp[0]; const acc = (disp.length>1)?(disp[1]==='#'?'#':'b'):'';
      out.push({ display:{s:letter.toLowerCase(), a:acc, o:oct}, play: play + oct });
    }
  }
  return out;
}
const scales = { C: buildScaleForKey('C'), G: buildScaleForKey('G'), F: buildScaleForKey('F') };
const vexKeys = { C:'C', G:'G', F:'F' };
function noteToVexKey(note){ if(!note) return 'b/4'; const d = note.display; const acc = d.a === '#' ? '#' : (d.a === 'b' ? 'b' : ''); return `${d.s}${acc}/${d.o}`; }

// UI 초기화/렌더
setActiveButtons();
renderAll();
window.addEventListener('resize', ()=>{ clearTimeout(window._rT); window._rT = setTimeout(()=>renderAll(),160); });

</script>
