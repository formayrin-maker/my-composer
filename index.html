<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>도전, 나도 작곡가!</title>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--fg:#111}
body{font-family:Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;background:var(--bg);color:var(--fg);margin:16px}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:18px;border-radius:10px;border:1px solid #e6eef8}
h1{color:var(--primary);text-align:center;margin:0 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px}
select,button,input[type=number]{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;cursor:pointer}
button.primary{background:var(--primary);color:#fff;border:0}
button.danger{background:#ef4444;color:#fff;border:0}
.note-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.dur-btn{padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
.dur-btn.active{background:var(--primary);color:#fff}
#score-container{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.measure-box{border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:#fff;min-height:140px;position:relative;display:flex;flex-direction:column;align-items:center}
.measure-box>div{touch-action:none;-ms-touch-action:none}
.measure-header{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#556;margin-bottom:6px}
.status{margin-top:8px;padding:8px;border-radius:8px;text-align:center}
.loading{background:#fef08a;color:#854d0e}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.measure-box.active{box-shadow:0 0 0 3px rgba(37,99,235,0.08);border-color:var(--primary)}
.measure-box.dragging{outline:3px dashed rgba(37,99,235,0.18)}
.note-hint{position:absolute;right:8px;top:32px;font-size:12px;color:#777}
.solfeggio{display:flex;gap:6px;align-items:center}
.solfeggio button{padding:6px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:700}
.solfeggio .oct{display:flex;gap:6px;align-items:center;margin-left:8px}
</style>

<!-- VexFlow (browser UMD build) -->
<script src="https://unpkg.com/vexflow/releases/vexflow-min.js"></script>
<!-- Tone.js and Midi library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
</head>
<body>
<div class="wrap">
  <h1>🎼 도전, 나도 작곡가!</h1>

  <div class="toolbar">
    <label>조성:
      <select id="keySelect">
        <option value="C">다장조 (C)</option>
        <option value="G">사장조 (G)</option>
        <option value="F">바장조 (F)</option>
      </select>
    </label>

    <label>연주 악기:
      <select id="instrSelect">
        <option value="acoustic_grand_piano">피아노</option>
        <option value="flute">플루트</option>
        <option value="acoustic_guitar_nylon">어쿠스틱 기타</option>
        <option value="electric_guitar_clean">일렉 기타</option>
        <option value="violin">바이올린</option>
        <option value="xylophone">실로폰</option>
      </select>
    </label>

    <label>반주 악기:
      <select id="accompSelect">
        <option value="none">없음</option>
        <option value="acoustic_grand_piano">피아노</option>
        <option value="acoustic_guitar_nylon">어쿠스틱 기타</option>
        <option value="drum_kit">드럼</option>
      </select>
    </label>

    <button id="playBtn" class="primary">▶ 전체 재생</button>
    <button id="stopBtn">■ 정지</button>
    <button id="undoBtn">↩️ 실행 취소</button>
    <button id="clearAllBtn" class="danger">🗑️ 모두 지우기</button>
  </div>

  <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:8px">
    <label>템포: <input id="tempoInput" type="number" value="100" min="40" max="200" style="width:90px"></label>
    <button id="saveJsonBtn" style="background:#10b981;color:white;border:0">💾 저장</button>
    <button id="loadJsonBtn" style="background:#06b6d4;color:white;border:0">📂 불러오기</button>
    <input id="fileInput" type="file" accept=".json" style="display:none">
    <button id="exportPngBtn">🖼️ 악보 저장</button>
    <button id="exportMidiBtn" style="background:#f59e0b;color:white;border:0">🎹 음악 저장</button>
  </div>

  <div class="note-tools">
    <div style="text-align:center">
      <div style="font-weight:800;margin-bottom:6px">음표</div>
      <button class="dur-btn" id="dur_w">온음표</button>
      <button class="dur-btn" id="dur_h">2분음표</button>
      <button class="dur-btn active" id="dur_q">4분음표</button>
      <button class="dur-btn" id="dur_8">8분음표</button>
    </div>

    <div style="text-align:center;border-left:1px dashed #e2e8f0;padding-left:12px">
      <div style="font-weight:800;margin-bottom:6px">쉼표</div>
      <button class="dur-btn" id="rest_w">온쉼표</button>
      <button class="dur-btn" id="rest_h">2분쉼표</button>
      <button class="dur-btn" id="rest_q">4분쉼표</button>
      <button class="dur-btn" id="rest_8">8분쉼표</button>
    </div>

    <div style="display:flex;flex-direction:column;justify-content:center;border-left:1px dashed #e2e8f0;padding-left:12px">
      <div style="margin-bottom:6px"><button id="recommendNoteBtn" class="primary">✨ 추천 음표</button></div>
      <div><button id="recommendMelodyBtn" class="primary" style="background:#8b5cf6">🎵 추천 멜로디</button></div>
    </div>
  </div>

  <div style="display:flex;justify-content:center;margin-bottom:10px;gap:12px;align-items:center">
    <div class="solfeggio">
      <button data-solf="do">도</button>
      <button data-solf="re">레</button>
      <button data-solf="mi">미</button>
      <button data-solf="fa">파</button>
      <button data-solf="sol">솔</button>
      <button data-solf="la">라</button>
      <button data-solf="si">시</button>
      <div class="oct">
        <button id="octDown">－</button>
        <span id="octDisplay" style="min-width:22px;text-align:center;font-weight:700">4</span>
        <button id="octUp">＋</button>
      </div>
    </div>
  </div>

  <div id="status" class="status loading">로딩 중... Play 버튼 또는 오선 클릭으로 오디오를 활성화하세요.</div>

  <div id="score-container"></div>
</div>

<script>
/* 전체 기능을 유지하면서 VexFlow UMD 로드 및 키 라벨 한글 병기 반영한 완전판
   기존 동작(편집, 드래그, 펜 지원, 샘플 로드, 반주, 추천) 유지 */
(function(){
  // 기본 설정
  const NUM_MEASURES = 8;
  const BEATS_PER_MEASURE = 4;
  const beatValue = { w:4, h:2, q:1, '8':0.5 };
  let tempo = 100;
  let currentOctave = 4;

  const measures = Array.from({length:NUM_MEASURES}, ()=>[]);
  const history = [];

  const SF_BASE = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';
  const instrMap = {
    acoustic_grand_piano:'acoustic_grand_piano',
    flute:'flute',
    acoustic_guitar_nylon:'acoustic_guitar_nylon',
    electric_guitar_clean:'electric_guitar_clean',
    violin:'violin',
    xylophone:'xylophone'
  };

  let synthPrimary = null;
  let melodySampler = null;
  let samplerReady = false;

  let accompSampler = null;
  let accompReady = false;

  let isPointerDown = false;
  let draggingNote = null;
  let pointerStart = null;

  let statusLockUntil = 0;
  function setStatus(text, cls='ok', force=false){
    const now = Date.now();
    if (!force && now < statusLockUntil) return;
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status ' + cls;
  }
  function flashError(msg){
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status err';
    statusLockUntil = Date.now() + 2200;
    setTimeout(()=>{ if (Date.now() >= statusLockUntil) setStatus('작성 계속하세요!', 'ok', true); }, 2300);
  }

  function initSynth(){
    try{ if (synthPrimary) synthPrimary.dispose(); }catch(e){}
    synthPrimary = new Tone.PolySynth(Tone.Synth, { maxPolyphony:8 }).toDestination();
    synthPrimary.set({ voice:{ envelope:{ attack:0.01, decay:0.1, sustain:0.9, release:0.2 } } });
    setStatus('합성기 준비됨', 'ok', true);
  }
  initSynth();

  function playMelodyNote(name, dur, at){
    try{
      if (samplerReady && melodySampler) melodySampler.triggerAttackRelease(name, dur, at);
      else synthPrimary.triggerAttackRelease(name, dur, at);
    }catch(e){
      try{ synthPrimary.triggerAttackRelease(name, dur, at); }catch(_){}
    }
  }

  async function headOk(url){
    try{
      const r = await fetch(url, { method:'HEAD' });
      return r && r.status === 200;
    }catch(e){
      try{
        const r = await fetch(url, { method:'GET' });
        return r && r.status === 200;
      }catch(_){ return false; }
    }
  }

  async function findSampleName(baseUrl, note){
    const tries = [ note + '.mp3', encodeURIComponent(note) + '.mp3' ];
    const sharpToFlat = { 'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb' };
    const m = note.match(/^([A-G])([#b]?)(\d)$/);
    if (m && m[2] === '#'){
      const flat = sharpToFlat[m[1] + '#'];
      if (flat) tries.push(flat + m[3] + '.mp3', encodeURIComponent(flat + m[3]) + '.mp3');
    }
    for (const fn of tries){
      const url = baseUrl + fn;
      if (await headOk(url)) return fn;
    }
    return null;
  }

  async function buildMapping(baseUrl, notes){
    const mapping = {};
    const concurrency = 6;
    for (let i=0;i<notes.length;i+=concurrency){
      const batch = notes.slice(i, i+concurrency);
      await Promise.all(batch.map(async note=>{
        try{
          const fn = await findSampleName(baseUrl, note);
          if (fn) mapping[note] = fn;
        }catch(e){ console.warn('sample check failed', note, e); }
      }));
    }
    return mapping;
  }

  async function loadMelodySampler(instr, notes){
    samplerReady = false;
    if (melodySampler){ try{ melodySampler.dispose(); }catch(e){} melodySampler = null; }
    const folder = instrMap[instr] || instr;
    const baseUrl = SF_BASE + folder + '-mp3/';
    try{
      setStatus('멜로디 샘플 확인 중...', 'loading', true);
      const urls = await buildMapping(baseUrl, notes);
      if (!urls || Object.keys(urls).length === 0){
        setStatus('멜로디 샘플을 찾지 못했습니다. 합성기로 재생', 'err', true);
        return;
      }
      setStatus('멜로디 샘플 로드 중...', 'loading', true);
      melodySampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl,
        onload: ()=>{ samplerReady = true; setStatus('멜로디 샘플 준비 완료', 'ok', true); },
        onerror: (e)=>{ console.warn('melody sampler error', e); setStatus('멜로디 샘플 로드 에러(합성기 폴백)', 'err', true); }
      }).toDestination();
      window.melodySampler = melodySampler;
    }catch(e){
      console.warn('loadMelodySampler err', e);
      setStatus('멜로디 샘플 초기화 실패', 'err', true);
    }
  }

  async function loadAccompSampler(instr, notes){
    accompReady = false;
    if (accompSampler){ try{ accompSampler.dispose(); }catch(e){} accompSampler=null; }
    if (instr === 'none') return;
    const folder = instrMap[instr] || instr;
    const baseUrl = SF_BASE + folder + '-mp3/';
    try{
      setStatus('반주 샘플 확인 중...', 'loading', true);
      const urls = await buildMapping(baseUrl, notes.length>0?notes:['C4','E4','G4']);
      if (!urls || Object.keys(urls).length === 0){
        setStatus('반주 샘플을 찾지 못했습니다. 반주는 합성기 폴백', 'err', true);
        return;
      }
      setStatus('반주 샘플 로드 중...', 'loading', true);
      accompSampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl,
        onload: ()=>{ accompReady = true; setStatus('반주 샘플 준비 완료', 'ok', true); },
        onerror: (e)=>{ console.warn('accomp sampler err', e); setStatus('반주 샘플 일부 실패(폴백)', 'err', true); }
      }).toDestination();
      window.accompSampler = accompSampler;
    }catch(e){
      console.warn('loadAccompSampler err', e);
      setStatus('반주 샘플 초기화 실패', 'err', true);
    }
  }

  function pitchClass(name){
    const m = (''+name).match(/^([A-G])([#b]?)/);
    return m ? (m[1] + (m[2]||'')) : name;
  }
  function chooseChordRootForMeasure(mi){
    const key = document.getElementById('keySelect').value;
    const count = {};
    for (const n of measures[mi]){
      if (!n.isRest && n.pitch && n.pitch.play){
        const pc = pitchClass(n.pitch.play);
        count[pc] = (count[pc]||0) + 1;
      }
    }
    if (Object.keys(count).length === 0) return key;
    const entries = Object.entries(count).sort((a,b)=>b[1]-a[1]);
    const top = entries[0][0];
    const map = { C:{tonic:'C',dominant:'G'}, G:{tonic:'G',dominant:'D'}, F:{tonic:'F',dominant:'C'} };
    const km = map[key] || map['C'];
    if (top === km.tonic) return km.tonic;
    if (top === km.dominant) return km.dominant;
    return top;
  }
  function chordTriad(root, oct){
    const semis = { C:0,'C#':1,Db:1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11 };
    const findName = (val)=>{
      for (const p in semis) if (semis[p] === val) return p;
      return 'C';
    };
    const mapping = { Bb:'A#' };
    const r = mapping[root] || root;
    const idx = semis[r] !== undefined ? semis[r] : semis['C'];
    const third = (idx + 4) % 12;
    const fifth = (idx + 7) % 12;
    return [ findName(idx) + oct, findName(third) + oct, findName(fifth) + oct ];
  }

  function scheduleAccompanimentMeasure(startTime, measureIndex){
    const type = document.getElementById('accompSelect').value;
    if (type === 'none') return;
    const root = chooseChordRootForMeasure(measureIndex);
    const chord = chordTriad(root, currentOctave);
    const beatSec = 60 / tempo;
    if (type === 'acoustic_grand_piano'){
      for (let b=0;b<4;b++){
        const t = startTime + b * beatSec;
        for (let i=0;i<3;i++){
          const nt = t + i * (beatSec/6);
          if (accompReady && accompSampler) {
            try{ accompSampler.triggerAttackRelease(chord[i], beatSec*0.8, nt); }catch(e){ synthPrimary.triggerAttackRelease(chord[i], beatSec*0.8, nt); }
          } else {
            synthPrimary.triggerAttackRelease(chord[i], beatSec*0.8, nt);
          }
        }
      }
    } else if (type === 'acoustic_guitar_nylon'){
      for (let b=0;b<4;b++){
        const t = startTime + b * beatSec;
        for (let i=0;i<3;i++){
          const nt = t + i*0.02;
          if (accompReady && accompSampler) {
            try{ accompSampler.triggerAttackRelease(chord[i], beatSec*0.9, nt); }catch(e){ synthPrimary.triggerAttackRelease(chord[i], beatSec*0.9, nt); }
          } else synthPrimary.triggerAttackRelease(chord[i], beatSec*0.9, nt);
        }
      }
    } else if (type === 'drum_kit'){
      for (let b=0;b<4;b++){
        const t = startTime + b*beatSec;
        if (b%2===0){
          if (accompReady && accompSampler) { try{ accompSampler.triggerAttackRelease('C2',0.12,t); }catch(e){ synthPrimary.triggerAttackRelease('C2',0.12,t);} }
          else synthPrimary.triggerAttackRelease('C2',0.12,t);
        } else {
          if (accompReady && accompSampler) { try{ accompSampler.triggerAttackRelease('D2',0.12,t); }catch(e){ synthPrimary.triggerAttackRelease('D2',0.12,t);} }
          else synthPrimary.triggerAttackRelease('D2',0.12,t);
        }
        const t2 = t + beatSec/2;
        if (accompReady && accompSampler) { try{ accompSampler.triggerAttackRelease('G4',0.06,t); accompSampler.triggerAttackRelease('G4',0.06,t2); }catch(e){ synthPrimary.triggerAttackRelease('G4',0.06,t); synthPrimary.triggerAttackRelease('G4',0.06,t2); } }
        else { synthPrimary.triggerAttackRelease('G4',0.06,t); synthPrimary.triggerAttackRelease('G4',0.06,t2); }
      }
    }
  }

  function scheduleAllAndStart(){
    Tone.Transport.cancel();
    const beatSec = 60/tempo;
    let t = Tone.now() + 0.06;
    for (let m=0;m<NUM_MEASURES;m++){
      (function(measureIndex, startT){
        Tone.Transport.schedule((time)=>{
          document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active'));
          const boxes = document.querySelectorAll('.measure-box');
          if (boxes[measureIndex]) boxes[measureIndex].classList.add('active');
        }, startT - (Tone.now()+0.06));
        Tone.Transport.schedule((time)=>{ scheduleAccompanimentMeasure(time, measureIndex); }, startT - (Tone.now()+0.06));
        let inner = startT;
        for (const note of measures[measureIndex]){
          const durSec = note.beats * beatSec;
          (function(nobj, at){
            Tone.Transport.schedule((time)=>{
              if (!nobj.isRest){
                playMelodyNote(nobj.pitch.play, nobj.beats * beatSec, time);
              }
            }, at - (Tone.now()+0.06));
          })(note, inner);
          inner += durSec;
        }
      })(m, t);
      t += 4 * beatSec;
    }
    Tone.Transport.schedule((time)=>{
      document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active'));
      try{ Tone.Transport.stop(); }catch(e){}
    }, t - (Tone.now()+0.06));
    try{ Tone.Transport.start(); }catch(e){ console.warn('Transport start error', e); }
  }

  const VF = Vex.Flow;
  const scoreContainer = document.getElementById('score-container');

  function noteToVexKey(note){
    if (!note) return 'b/4';
    const d = note.display;
    const acc = (d.a === '#')? '#': (d.a === 'b' ? 'b' : '');
    return d.s + acc + '/' + d.o;
  }

  function renderAll(){
    scoreContainer.innerHTML = '';
    const key = document.getElementById('keySelect').value;
    const wrap = document.querySelector('.wrap');
    const wrapW = Math.min(wrap.clientWidth, 1100);
    const cols = 4, gap = 12;
    const measureOuter = Math.floor((wrapW - (cols - 1) * gap) / cols);
    const staveWidth = Math.max(120, Math.min(360, measureOuter - 16));
    const availableWidth = Math.max(40, Math.floor(staveWidth * 0.66));

    for (let i=0;i<NUM_MEASURES;i++){
      try{
        const box = document.createElement('div'); box.className = 'measure-box';
        const header = document.createElement('div'); header.className = 'measure-header';
        header.innerHTML = '<span>' + (i+1) + '마디</span><button onclick="clearMeasure('+i+')">🗑️</button>';
        box.appendChild(header);
        const div = document.createElement('div'); div.style.width = (staveWidth+20) + 'px'; div.style.height = '160px';
        box.appendChild(div);
        const hint = document.createElement('div'); hint.className = 'note-hint'; hint.textContent = '(빈칸 클릭 = 추가 · 음표 클릭→드래그 = 높이 변경)';
        box.appendChild(hint);
        scoreContainer.appendChild(box);

        const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
        renderer.resize(staveWidth+20, 160);
        const ctx = renderer.getContext();
        const stave = new VF.Stave(10, 28, staveWidth);
        if (i === 0) stave.addClef('treble').addTimeSignature('4/4');
        stave.addKeySignature(key);
        stave.setContext(ctx).draw();

        const notes = measures[i].map(n=>{
          const k = n.isRest ? 'b/4' : noteToVexKey(n.pitch);
          const d = n.isRest ? (n.duration + 'r') : n.duration;
          return new VF.StaveNote({ clef:'treble', keys:[k], duration: d, auto_stem:true });
        });

        const voice = new VF.Voice({ num_beats: BEATS_PER_MEASURE, beat_value: 4 });
        voice.setStrict(false);
        if (notes.length > 0){
          voice.addTickables(notes);
          new VF.Formatter().joinVoices([voice]).format([voice], availableWidth);
          voice.draw(ctx, stave);
        } else {
          const placeholder = [ new VF.StaveNote({ clef:'treble', keys:['b/4'], duration:'wr' }) ];
          const v2 = new VF.Voice({ num_beats:4, beat_value:4 });
          v2.setStrict(false);
          v2.addTickables(placeholder);
          new VF.Formatter().joinVoices([v2]).format([v2], availableWidth);
          v2.draw(ctx, stave);
        }

        div.addEventListener('pointerdown', async function(ev){
          ev.preventDefault();
          try{ this.setPointerCapture(ev.pointerId); }catch(e){}
          for (let p=0;p<i;p++){
            const sum = measures[p].reduce((s,n)=>s+n.beats,0);
            if (sum < BEATS_PER_MEASURE){ flashError((p+1)+'마디를 먼저 채워주세요.'); try{ this.releasePointerCapture(ev.pointerId); }catch(e){} return; }
          }
          isPointerDown = true;
          try{ await Tone.start(); if (Tone.context && Tone.context.state === 'suspended') await Tone.context.resume(); }catch(e){}
          const rect = div.getBoundingClientRect();
          div._pointerStart = { x: ev.clientX - rect.left, y: ev.clientY - rect.top, rect: rect, measureIdx: i };
        }, { passive:false });

        div.addEventListener('pointermove', function(ev){
          if (!isPointerDown) return;
          const start = div._pointerStart;
          if (!start) return;
          const rect = start.rect;
          const dx = (ev.clientX - (rect.left + start.x));
          const dy = (ev.clientY - (rect.top + start.y));
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (!div._draggingStarted && dist > 6){
            if (measures[i].length > 0){
              const slotW = rect.width / measures[i].length;
              const px = ev.clientX - rect.left;
              let idxNote = Math.floor(px / slotW);
              idxNote = Math.max(0, Math.min(measures[i].length-1, idxNote));
              div._draggingStarted = { noteIdx: idxNote, from: measures[i][idxNote].pitch };
              div.parentElement.classList.add('dragging');
            }
          }
          if (div._draggingStarted){
            const rect2 = div.getBoundingClientRect();
            const y = ev.clientY - rect2.top;
            const scale = scales[document.getElementById('keySelect').value];
            let slot = Math.floor(((y - 30) / (rect2.height - 40)) * scale.length);
            slot = Math.max(0, Math.min(scale.length-1, slot));
            const noteObj = scale[slot];
            const n = measures[i][div._draggingStarted.noteIdx];
            if (!n || n.isRest) return;
            if (n.pitch.play !== noteObj.play){
              n.pitch = { display: noteObj.display, play: noteObj.play };
              renderAll();
            }
          }
        }, { passive:false });

        div.addEventListener('pointerup', function(ev){
          try{ this.releasePointerCapture(ev.pointerId); }catch(e){}
          isPointerDown = false;
          const start = div._pointerStart;
          if (div._draggingStarted){
            div.parentElement.classList.remove('dragging');
            div._draggingStarted = null;
            div._pointerStart = null;
            history.push({ type:'move', measure:i });
            renderAll();
            return;
          }
          if (start){
            const rect2 = start.rect;
            const y = ev.clientY - rect2.top;
            const scale = scales[document.getElementById('keySelect').value];
            let slot = Math.floor(((y - 30) / (rect2.height - 40)) * scale.length);
            slot = Math.max(0, Math.min(scale.length-1, slot));
            const noteObj = scale[slot];
            addNoteToMeasure(i, noteObj, selectedDur, selectedIsRest);
            div._pointerStart = null;
          }
        }, { passive:false });

        div.addEventListener('pointercancel', function(ev){
          try{ this.releasePointerCapture(ev.pointerId); }catch(e){}
          isPointerDown = false;
          div._pointerStart = null;
          div._draggingStarted = null;
        }, { passive:false });

      }catch(err){
        console.error(err);
        setStatus('렌더 중 오류가 발생했습니다 (콘솔 확인)', 'err', true);
      }
    }
  }

  function addNoteToMeasure(measureIdx, scaleNoteObj, durKey, isRest){
    if (measureIdx < 0 || measureIdx >= NUM_MEASURES) return false;
    const beats = beatValue[durKey];
    const sum = measures[measureIdx].reduce((s,n)=>s+n.beats,0);
    if (sum + beats > BEATS_PER_MEASURE){ flashError((measureIdx+1)+'마디 박자 초과'); return false; }
    const stored = isRest ? { pitch:null, duration:durKey, beats:beats, isRest:true } : { pitch:{ display: scaleNoteObj.display, play: scaleNoteObj.play }, duration:durKey, beats:beats, isRest:false };
    measures[measureIdx].push(stored);
    history.push({ type:'add', measure: measureIdx });
    if (!isRest){
      const durSec = beats * (60/tempo);
      playMelodyNote(stored.pitch.play, durSec, Tone.now());
    }
    autosave();
    renderAll();
    return true;
  }

  function clearMeasure(idx){ if (measures[idx].length===0) return; if (!confirm((idx+1)+'마디를 지우시겠습니까?')) return; const prev = JSON.parse(JSON.stringify(measures[idx])); measures[idx]=[]; history.push({ type:'clear', measure: idx, prev: prev }); autosave(); renderAll(); }
  document.getElementById('clearAllBtn').addEventListener('click', ()=>{ if (!confirm('전체 악보를 완전히 지우시겠습니까? (로컬자동저장도 삭제됩니다)')) return; const prevAll = JSON.parse(JSON.stringify(measures)); for (let i=0;i<NUM_MEASURES;i++) measures[i]=[]; history.push({ type:'clearAll', prev: prevAll }); try{ localStorage.removeItem(AUTOSAVE_KEY); } catch(e){} try{ if (melodySampler){ melodySampler.dispose(); melodySampler=null; samplerReady=false; } }catch(e){} stopAllAudio(); renderAll(); setStatus('전체 초기화 완료', 'ok', true); });
  document.getElementById('undoBtn').addEventListener('click', ()=>{ const h = history.pop(); if (!h) return; if (h.type === 'add') measures[h.measure].pop(); else if (h.type === 'move'){ const n = measures[h.measure][h.noteIdx]; if (n){ if (h.from === null) n.isRest = true, n.pitch=null; else n.isRest=false, n.pitch = h.from; } } else if (h.type === 'clear') measures[h.measure] = h.prev; else if (h.type === 'clearAll'){ for (let i=0;i<NUM_MEASURES;i++) measures[i] = h.prev[i] || []; } autosave(); renderAll(); });

  let selectedDur = 'q';
  let selectedIsRest = false;
  function setActiveButtons(){ document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active')); document.getElementById('dur_'+selectedDur).classList.add('active'); }
  ['w','h','q','8'].forEach(d=>{
    document.getElementById('dur_'+d).addEventListener('click', ()=>{ selectedIsRest=false; selectedDur=d; setActiveButtons(); });
    const restBtn = document.getElementById('rest_'+d);
    if (restBtn) restBtn.addEventListener('click', ()=>{ selectedIsRest=true; selectedDur=d; setActiveButtons(); });
  });

  // recommendation (context-aware)
  function recommendContextNote(){
    const key = document.getElementById('keySelect').value;
    const scale = scales[key];
    let prev = null;
    for (let i=0;i<NUM_MEASURES;i++){
      if (measures[i].length>0) prev = measures[i][measures[i].length-1];
    }
    if (!prev){
      const root = chordTriad(key, currentOctave)[0];
      return { display:{ s: root[0].toLowerCase(), a:(root[1]==='#'?'#':''), o:currentOctave }, play: root };
    }
    const p = prev.pitch.play;
    const idx = scales[key].findIndex(s=>s.play === p);
    let targetIdx = (idx >= 0) ? idx : Math.floor(scales[key].length/2);
    const step = Math.floor(Math.random()*3)-1;
    targetIdx = Math.max(0, Math.min(scales[key].length-1, targetIdx + step));
    const s = scales[key][targetIdx];
    return { display:s.display, play:s.play };
  }
  document.getElementById('recommendNoteBtn').addEventListener('click', ()=>{
    const noteObj = recommendContextNote();
    const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
    if (idx < 0) { flashError('빈 마디가 없습니다'); return; }
    selectedIsRest=false; selectedDur='q'; setActiveButtons(); addNoteToMeasure(idx, noteObj, 'q', false);
  });
  document.getElementById('recommendMelodyBtn').addEventListener('click', ()=>{
    const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) === 0);
    if (idx < 0){ flashError('추천할 빈 마디가 없습니다'); return; }
    const key = document.getElementById('keySelect').value;
    const scale = scales[key];
    const startIndex = Math.floor(scale.length/2);
    const patterns = [['q','q','q','q'],['h','q','q'],['q','q','h'],['q','8','8','q']];
    const pat = patterns[Math.floor(Math.random()*patterns.length)];
    measures[idx] = [];
    let cur = startIndex;
    for (const d of pat){
      const mv = Math.floor(Math.random()*3)-1;
      cur = Math.max(0, Math.min(scale.length-1, cur + mv));
      addNoteToMeasure(idx, scale[cur], d, false);
    }
    setStatus('추천 멜로디 적용', 'ok', true);
  });

  // solfeggio buttons
  document.querySelectorAll('.solfeggio button[data-solf]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const map = { do:0, re:1, mi:2, fa:3, sol:4, la:5, si:6 };
      const deg = map[btn.getAttribute('data-solf')];
      const key = document.getElementById('keySelect').value;
      const note = scales[key][deg] || scales[key][0];
      const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
      if (idx < 0){ flashError('빈 마디가 없습니다'); return; }
      addNoteToMeasure(idx, note, selectedDur, false);
    });
  });
  document.getElementById('octUp').addEventListener('click', ()=>{ if (currentOctave < 6) currentOctave++; document.getElementById('octDisplay').textContent = currentOctave; });
  document.getElementById('octDown').addEventListener('click', ()=>{ if (currentOctave > 2) currentOctave--; document.getElementById('octDisplay').textContent = currentOctave; });

  // play/stop
  document.getElementById('playBtn').addEventListener('click', async ()=>{
    try{ await Tone.start(); if (Tone.context && Tone.context.state === 'suspended') await Tone.context.resume(); }catch(e){ console.warn('Tone.start/resume', e); }
    tempo = parseInt(document.getElementById('tempoInput').value) || 100;
    const uniq = new Set();
    for (const m of measures) for (const n of m) if (!n.isRest && n.pitch && n.pitch.play) uniq.add(n.pitch.play);
    const usedNotes = Array.from(uniq);
    const instr = document.getElementById('instrSelect').value;
    if (usedNotes.length>0) loadMelodySampler(instr, usedNotes);
    const accomp = document.getElementById('accompSelect').value;
    if (accomp !== 'none') loadAccompSampler(accomp, usedNotes);
    scheduleAllAndStart();
  });

  document.getElementById('stopBtn').addEventListener('click', ()=>{
    try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){}
    try{ if (synthPrimary){ synthPrimary.releaseAll(); synthPrimary.dispose(); } }catch(e){}
    initSynth();
    setStatus('정지', 'ok', true);
  });

  document.getElementById('instrSelect').addEventListener('change', async ()=>{
    const instr = document.getElementById('instrSelect').value;
    const uniq = new Set();
    for (const m of measures) for (const n of m) if (!n.isRest && n.pitch && n.pitch.play) uniq.add(n.pitch.play);
    const usedNotes = Array.from(uniq);
    await loadMelodySampler(instr, usedNotes);
  });

  document.getElementById('accompSelect').addEventListener('change', async ()=>{
    const accomp = document.getElementById('accompSelect').value;
    const uniq = new Set();
    for (const m of measures) for (const n of m) if (!n.isRest && n.pitch && n.pitch.play) uniq.add(n.pitch.play);
    const usedNotes = Array.from(uniq);
    const wasPlaying = Tone.Transport.state === 'started';
    if (wasPlaying){ try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){} }
    await loadAccompSampler(accomp, usedNotes);
    if (wasPlaying) scheduleAllAndStart();
  });

  // save/load/export
  document.getElementById('saveJsonBtn').addEventListener('click', ()=>{
    try{
      const obj = { key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) || 100 };
      const blob = new Blob([JSON.stringify(obj,null,2)], { type:'application/json' });
      const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href = url; a.download = '활동내용.json'; a.click(); URL.revokeObjectURL(url);
    }catch(e){ console.warn(e); flashError('저장 실패'); }
  });
  document.getElementById('loadJsonBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', ev=>{
    const f = ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const obj = JSON.parse(r.result);
        if (!obj.measures) throw new Error('invalid');
        for (let i=0;i<NUM_MEASURES && i<obj.measures.length;i++) measures[i]=obj.measures[i];
        if (obj.key) document.getElementById('keySelect').value = obj.key;
        if (obj.tempo) document.getElementById('tempoInput').value = obj.tempo;
        autosave();
        renderAll();
        setStatus('불러오기 완료', 'ok', true);
      }catch(e){ console.warn(e); alert('불러오기 실패'); }
    };
    r.readAsText(f);
    ev.target.value = '';
  });

  document.getElementById('exportMidiBtn').addEventListener('click', ()=>{
    try{
      const midi = new Midi();
      const track = midi.addTrack();
      const tempoVal = parseInt(document.getElementById('tempoInput').value) || 100;
      midi.header.setTempo(tempoVal);
      const secPerBeat = 60/tempoVal;
      let time = 0;
      for (let m=0;m<NUM_MEASURES;m++){
        for (const n of measures[m]){
          const dur = n.beats * secPerBeat;
          if (!n.isRest) track.addNote({ name: n.pitch.play, time: time, duration: dur, velocity:0.9 });
          time += dur;
        }
      }
      const midArray = midi.toArray();
      const blob = new Blob([midArray], { type:'audio/midi' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'my_music.mid'; a.click(); URL.revokeObjectURL(url);
      setStatus('MIDI 생성 완료', 'ok', true);
    }catch(e){ console.warn(e); flashError('MIDI 내보내기 실패'); }
  });

  function autosave(){ try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) })); }catch(e){} }
  function loadAutosave(){ try{ const s = localStorage.getItem(AUTOSAVE_KEY); if (!s) return; const obj = JSON.parse(s); if (obj.measures){ for (let i=0;i<NUM_MEASURES && i<obj.measures.length;i++) measures[i]=obj.measures[i]; } if (obj.key) document.getElementById('keySelect').value = obj.key; if (obj.tempo) document.getElementById('tempoInput').value = obj.tempo; }catch(e){} }
  loadAutosave();

  // scale builder
  const semitoneMaster = (function(){ const out=[]; const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; for (let o=6;o>=4;o--) for (const n of names) out.push(n+o); return out; })();
  function buildScaleForKey(key){
    const tonicMap = { C:0, G:7, F:5 };
    const pcMap = { C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11 };
    const diatonic = [0,2,4,5,7,9,11];
    const t = tonicMap[key];
    const out = [];
    for (const nm of semitoneMaster){
      const namePart = nm.slice(0,-1);
      const oct = parseInt(nm.slice(-1),10);
      const pc = pcMap[namePart];
      const rel = (pc - t + 12) % 12;
      if (diatonic.indexOf(rel) >= 0){
        let disp = namePart;
        if (key === 'F' && namePart === 'A#') disp = 'Bb';
        const acc = disp.length>1 ? (disp[1]==='#'?'#':'b') : '';
        out.push({ display:{ s: disp[0].toLowerCase(), a: acc, o: oct }, play: disp + oct });
      }
    }
    return out;
  }
  const scales = { C: buildScaleForKey('C'), G: buildScaleForKey('G'), F: buildScaleForKey('F') };

  // initialize UI
  document.getElementById('octDisplay').textContent = currentOctave;
  setActiveButtons();
  renderAll();

  window.addEventListener('resize', ()=>{ clearTimeout(window._rT); window._rT = setTimeout(()=>renderAll(),160); });

})();
</script>
</body>
</html>
