<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>도전, 나도 작곡가!</title>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--fg:#111}
body{font-family:Inter, "Segoe UI", Roboto, Arial, sans-serif;background:var(--bg);color:var(--fg);margin:16px}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:18px;border-radius:10px;border:1px solid #e6eef8}
h1{color:var(--primary);text-align:center;margin:0 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px}
select,button,input[type=number]{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;cursor:pointer}
button.primary{background:var(--primary);color:#fff;border:0}
button.danger{background:#ef4444;color:#fff;border:0}
.note-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.dur-btn{padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
.dur-btn.active{background:var(--primary);color:#fff}
#score-container{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.measure-box{border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:#fff;min-height:140px;position:relative;display:flex;flex-direction:column;align-items:center}
.measure-box>div{touch-action:none;-ms-touch-action:none}
.measure-header{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#556;margin-bottom:6px}
.status{margin-top:8px;padding:8px;border-radius:8px;text-align:center}
.loading{background:#fef08a;color:#854d0e}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.measure-box.active{box-shadow:0 0 0 3px rgba(37,99,235,0.08);border-color:var(--primary)}
.measure-box.dragging{outline:3px dashed rgba(37,99,235,0.18)}
.note-hint{position:absolute;right:8px;top:32px;font-size:12px;color:#777}
.solfeggio{display:flex;gap:6px;align-items:center}
.solfeggio button{padding:6px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:700}
.solfeggio .oct{display:flex;gap:6px;align-items:center;margin-left:8px}
.small{font-size:13px;color:#556}
</style>

<!-- VexFlow (specific stable v4 build) -->
<script>
  // Safe loader: try specific VexFlow v4 release on unpkg then jsDelivr fallback
  (function(){
    if (window.Vex && window.Vex.Flow){ window.__vex_ready = true; return; }
    window.__vex_ready = false;
    function loadScript(url){
      return new Promise(function(resolve,reject){
        var s=document.createElement('script'); s.src=url; s.async=true;
        s.onload=function(){ resolve(url); };
        s.onerror=function(){ reject(url); };
        document.head.appendChild(s);
      });
    }
    (async function tryLoad(){
      var cdns = [
        'https://unpkg.com/vexflow@4.2.3/releases/vexflow-min.js',
        'https://cdn.jsdelivr.net/npm/vexflow@4.2.3/releases/vexflow-min.js'
      ];
      for (var i=0;i<cdns.length;i++){
        try{
          await loadScript(cdns[i]);
          if (window.Vex && window.Vex.Flow){ window.__vex_ready = true; console.info('VexFlow loaded from', cdns[i]); return; }
        }catch(e){ console.warn('VexFlow load fail:', cdns[i]); }
      }
      console.error('VexFlow failed to load. Check network.');
    })();
  })();
</script>

<!-- Tone.js + Midi -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<body>

        <button id="octDown">－</button>

  <div id="status" class="status loading">로딩 중... 오선(악보)이 보이면 준비된 것입니다. Play 또는 버튼 클릭으로 오디오 허용을 해 주세요.</div>

  <div id="score-container"></div>

<script>
/* Main app: waits for VexFlow then initializes. Keeps functions available on window for onclick handlers. */
(async function(){
  // Wait for VexFlow readiness (set by loader)
  const waitForVex = async (timeout = 6000) => {
    const start = Date.now();
    while (Date.now() - start < timeout) {
      if (window.Vex && window.Vex.Flow) return true;
      await new Promise(r => setTimeout(r, 100));
    }
    return !!(window.Vex && window.Vex.Flow);
  };
  const vexOk = await waitForVex(8000);
  if (!vexOk){
    document.getElementById('status').textContent = '악보 엔진(VexFlow) 로드 실패 — 네트워크 확인';
    document.getElementById('status').className = 'status err';
    console.error('VexFlow not loaded');
    return;
  }

  // Basic constants and state
  const NUM_MEASURES = 8;
  const BEATS_PER_MEASURE = 4;
  const beatValue = { w:4, h:2, q:1, '8':0.5 };
  let tempo = 100;
  let currentOctave = 3; // lowered default
  const MIN_OCTAVE = 2;
  const MAX_OCTAVE = 6;

  const measures = Array.from({length:NUM_MEASURES}, ()=>[]);
  const history = [];

  const SF_BASE = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';
  const instrMap = { acoustic_grand_piano:'acoustic_grand_piano', flute:'flute', acoustic_guitar_nylon:'acoustic_guitar_nylon', electric_guitar_clean:'electric_guitar_clean', violin:'violin', xylophone:'xylophone' };

  // Audio setup
  let synthPrimary = null;
  let melodySampler = null;
  let samplerReady = false;

  // accompaniment chain: accompGain controls accompaniment volume
  const accompGain = new Tone.Gain(0.35).toDestination(); // default 0.35
  let accompSampler = null;
  let accompReady = false;

  // improved synthetic drum fallback
  const kickSynth = new Tone.MembraneSynth({ pitchDecay:0.01, octaves:2, envelope:{ attack:0.001, decay:0.6, sustain:0.01, release:0.1 } }).connect(accompGain);
  const snareSynth = new Tone.NoiseSynth({ noise:{ type:'white' }, envelope:{ attack:0.001, decay:0.25, sustain:0 } }).connect(accompGain);
  const hhSynth = new Tone.MetalSynth({ frequency:600, envelope:{ attack:0.001, decay:0.08, release:0.01 }, harmonicity:5.1, modulationIndex:32 }).connect(accompGain);

  function setStatus(text, cls='ok', force=false){
    const s = document.getElementById('status');
    s.textContent = text; s.className = 'status ' + cls;
  }
  function flashError(msg){
    const s = document.getElementById('status'); s.textContent = msg; s.className = 'status err';
    setTimeout(()=>{ setStatus('작성 계속하세요!', 'ok', true); }, 2200);
  }

  function initSynth(){
    try{ if (synthPrimary) synthPrimary.dispose(); }catch(e){}
    synthPrimary = new Tone.PolySynth(Tone.Synth, { maxPolyphony:8 }).toDestination();
    synthPrimary.set({ voice:{ envelope:{ attack:0.01, decay:0.1, sustain:0.9, release:0.2 } } });
    setStatus('합성기 준비됨', 'ok', true);
  }
  initSynth();

  // play helper for melody
  function playMelodyNote(name, dur, at){
    try{
      if (samplerReady && melodySampler) melodySampler.triggerAttackRelease(name, dur, at);
      else synthPrimary.triggerAttackRelease(name, dur, at);
    }catch(e){
      try{ synthPrimary.triggerAttackRelease(name, dur, at); }catch(_){}
    }
  }
  window.playMelodyNote = playMelodyNote;

  // VexFlow helpers and render
  const VF = window.Vex.Flow;
  function noteToVexKey(note){ if(!note) return 'b/4'; const d = note.display; const acc = (d.a === '#')? '#': (d.a === 'b' ? 'b' : ''); return d.s + acc + '/' + d.o; }

  let isPointerDown = false;

  function renderAll(){
    const scoreContainer = document.getElementById('score-container');
    scoreContainer.innerHTML = '';
    const key = document.getElementById('keySelect').value;
    const wrap = document.querySelector('.wrap');
    const wrapW = Math.min(wrap.clientWidth, 1100);
    const cols = 4, gap = 12;
    const measureOuter = Math.floor((wrapW - (cols - 1) * gap) / cols);
    const staveWidth = Math.max(120, Math.min(360, measureOuter - 16));
    const availableWidth = Math.max(40, Math.floor(staveWidth * 0.66));

    for (let i=0;i<NUM_MEASURES;i++){
      const box = document.createElement('div'); box.className='measure-box';
      const header = document.createElement('div'); header.className='measure-header';
      header.innerHTML = '<span>' + (i+1) + '마디</span><button onclick="clearMeasure('+i+')">&#128465;</button>';
      box.appendChild(header);
      const div = document.createElement('div'); div.style.width=(staveWidth+20)+'px'; div.style.height='160px';
      box.appendChild(div);
      const hint = document.createElement('div'); hint.className='note-hint'; hint.textContent='(빈칸 클릭 = 추가 · 음표 클릭→드래그 = 높이 변경)';
      box.appendChild(hint);
      scoreContainer.appendChild(box);

      try{
        const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
        renderer.resize(staveWidth+20,160);
        const ctx = renderer.getContext();
        const stave = new VF.Stave(10,28,staveWidth);
        if (i===0) stave.addClef('treble').addTimeSignature('4/4');
        stave.addKeySignature(key);
        stave.setContext(ctx).draw();

        const notes = measures[i].map(n=>{
          const k = n.isRest ? 'b/4' : noteToVexKey(n.pitch);
          const d = n.isRest ? (n.duration + 'r') : n.duration;
          return new VF.StaveNote({ clef:'treble', keys:[k], duration: d, auto_stem:true });
        });
        const voice = new VF.Voice({ num_beats: BEATS_PER_MEASURE, beat_value:4 });
        voice.setStrict(false);
        if (notes.length>0){ voice.addTickables(notes); new VF.Formatter().joinVoices([voice]).format([voice], availableWidth); voice.draw(ctx, stave); }
        else { const placeholder=[ new VF.StaveNote({ clef:'treble', keys:['b/4'], duration:'wr' }) ]; const v2=new VF.Voice({num_beats:4,beat_value:4}); v2.setStrict(false); v2.addTickables(placeholder); new VF.Formatter().joinVoices([v2]).format([v2], availableWidth); v2.draw(ctx, stave); }

      }catch(e){
        console.error('VexFlow render error', e);
        setStatus('악보 렌더 중 오류(콘솔 확인)', 'err', true);
      }

      // pointer handlers
      div.addEventListener('pointerdown', async function(ev){
        ev.preventDefault();
        try{ this.setPointerCapture(ev.pointerId); }catch(e){}
        // ensure previous measures are complete
        for (let p=0;p<i;p++){
          const sum = measures[p].reduce((s,n)=>s+n.beats,0);
          if (sum < BEATS_PER_MEASURE){ flashError((p+1)+'마디를 먼저 채워주세요.'); try{ this.releasePointerCapture(ev.pointerId); }catch(e){} return; }
        }
        isPointerDown = true;
        try{ await Tone.start(); if (Tone.context && Tone.context.state === 'suspended') await Tone.context.resume(); }catch(e){ console.warn('Tone.start/resume failed', e); }
        const rect = this.getBoundingClientRect();
        this._pointerStart = { x: ev.clientX - rect.left, y: ev.clientY - rect.top, rect: rect, measureIdx: i };
      }, { passive:false });

      div.addEventListener('pointermove', function(ev){
        if (!isPointerDown) return;
        const start = this._pointerStart;
        if (!start) return;
        const rect = start.rect;
        const dx = (ev.clientX - (rect.left + start.x));
        const dy = (ev.clientY - (rect.top + start.y));
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (!this._draggingStarted && dist > 6){
          if (measures[i].length > 0){
            const slotW = rect.width / measures[i].length;
            const px = ev.clientX - rect.left;
            let idxNote = Math.floor(px / slotW);
            idxNote = Math.max(0, Math.min(measures[i].length-1, idxNote));
            this._draggingStarted = { noteIdx: idxNote, fromPitch: measures[i][idxNote].isRest ? null : measures[i][idxNote].pitch };
            this.parentElement.classList.add('dragging');
          }
        }
        if (this._draggingStarted){
          const rect2 = this.getBoundingClientRect();
          const y = ev.clientY - rect2.top;
          const scale = scales[document.getElementById('keySelect').value];
          let slot = Math.floor(((y - 30) / (rect2.height - 40)) * scale.length);
          slot = Math.max(0, Math.min(scale.length - 1, slot));
          const noteObj = scale[slot];
          const n = measures[i][this._draggingStarted.noteIdx];
          if (!n || n.isRest) return;
          if (n.pitch.play !== noteObj.play){
            n.pitch = { display: noteObj.display, play: noteObj.play };
            renderAll();
          }
        }
      }, { passive:false });

      div.addEventListener('pointerup', function(ev){
        try{ this.releasePointerCapture(ev.pointerId); }catch(e){}
        isPointerDown = false;
        if (this._draggingStarted){
          this.parentElement.classList.remove('dragging');
          this._draggingStarted = null;
          this._pointerStart = null;
          history.push({ type:'move', measure:i });
          renderAll();
          return;
        }
        const start = this._pointerStart;
        if (start){
          const rect2 = start.rect;
          const y = ev.clientY - rect2.top;
          const scale = scales[document.getElementById('keySelect').value];
          let slot = Math.floor(((y - 30) / (rect2.height - 40)) * scale.length);
          slot = Math.max(0, Math.min(scale.length - 1, slot));
          const noteObj = scale[slot];
          addNoteToMeasure(i, noteObj, selectedDur, selectedIsRest);
          this._pointerStart = null;
        }
      }, { passive:false });

      div.addEventListener('pointercancel', function(ev){ try{ this.releasePointerCapture(ev.pointerId); }catch(e){} isPointerDown=false; this._pointerStart=null; this._draggingStarted=null; }, { passive:false });

    }
  }
  window.renderAll = renderAll;

  // add note (adds only to the specified measure; plays melody note)
  function addNoteToMeasure(measureIdx, scaleNoteObj, durKey, isRest){
    if (measureIdx < 0 || measureIdx >= NUM_MEASURES) return false;
    const beats = beatValue[durKey];
    const sum = measures[measureIdx].reduce((s,n)=>s+n.beats,0);
    if (sum + beats > BEATS_PER_MEASURE){ flashError((measureIdx+1)+'마디 박자 초과'); return false; }
    const stored = isRest ? { pitch:null, duration:durKey, beats:beats, isRest:true } : { pitch:{ display: scaleNoteObj.display, play: scaleNoteObj.play }, duration:durKey, beats:beats, isRest:false };
    measures[measureIdx].push(stored);
    history.push({ type:'add', measure: measureIdx });
    if (!isRest){
      const durSec = beats * (60/tempo);
      playMelodyNote(stored.pitch.play, durSec, Tone.now());
    }
    try{ localStorage.setItem('composer_autosave_v2', JSON.stringify({ key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) })); }catch(e){}
    renderAll();
    return true;
  }
  window.addNoteToMeasure = addNoteToMeasure;

  function clearMeasure(idx){ if (measures[idx].length===0) return; if (!confirm((idx+1)+'마디를 지우시겠습니까?')) return; const prev=JSON.parse(JSON.stringify(measures[idx])); measures[idx]=[]; history.push({ type:'clear', measure: idx, prev: prev }); try{ localStorage.setItem('composer_autosave_v2', JSON.stringify({ key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) })); }catch(e){} renderAll(); }
  window.clearMeasure = clearMeasure;

  // Scales
  const semitoneMaster = (function(){ const out=[]; const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; for (let o=6;o>=2;o--) for (const n of names) out.push(n+o); return out; })();
  function buildScaleForKey(key){
    const tonicMap = { C:0, G:7, F:5 };
    const pcMap = { C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11 };
    const diatonic=[0,2,4,5,7,9,11];
    const t = tonicMap[key];
    const out = [];
    for (const nm of semitoneMaster){
      const namePart = nm.slice(0,-1);
      const oct = parseInt(nm.slice(-1),10);
      const pc = pcMap[namePart];
      const rel = (pc - t + 12) % 12;
      if (diatonic.indexOf(rel) >= 0){
        let disp = namePart;
        if (key === 'F' && namePart === 'A#') disp = 'Bb';
        const acc = disp.length>1 ? (disp[1]==='#'?'#':'b') : '';
        out.push({ display:{ s: disp[0].toLowerCase(), a: acc, o: oct }, play: disp + oct });
      }
    }
    return out;
  }
  const scales = { C: buildScaleForKey('C'), G: buildScaleForKey('G'), F: buildScaleForKey('F') };
  window.scales = scales;

  // Recommendation: fill only remaining beats in current measure
  function durationOrder() { return ['w','h','q','8']; }
  function beatsFor(d){ return beatValue[d] || 1; }

  function recommendNoteForCurrentMeasure(){
    const key = document.getElementById('keySelect').value;
    const scale = scales[key];
    const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
    if (idx < 0) return null;
    // pick contextual note: tonic/near previous
    let prev = null;
    for (let i=0;i<NUM_MEASURES;i++){ if (measures[i].length>0) prev = measures[i][measures[i].length-1]; }
    if (!prev){
      const root = triad(key, currentOctave)[0];
      return { note: scale[Math.floor(scale.length/2)], dur:'q' };
    }
    const p = prev.pitch.play;
    const pi = scale.findIndex(s=>s.play===p);
    let candIdx = (pi>=0)?pi:Math.floor(scale.length/2);
    // prefer stepwise
    const step = Math.floor(Math.random()*3)-1;
    candIdx = Math.max(0, Math.min(scale.length-1, candIdx+step));
    // choose duration to fit remaining beats
    const remaining = BEATS_PER_MEASURE - measures[idx].reduce((s,n)=>s+n.beats,0);
    const durCandidates = durationOrder().filter(d=>beatsFor(d) <= remaining);
    const dur = durCandidates.length ? durCandidates[Math.floor(Math.random()*durCandidates.length)] : 'q';
    return { note: scale[candIdx], dur: dur };
  }

  document.getElementById('recommendNoteBtn').addEventListener('click', async ()=>{
    try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){ console.warn(e); }
    const rec = recommendNoteForCurrentMeasure();
    if (!rec){ flashError('빈 마디가 없습니다'); return; }
    addNoteToMeasure(measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE), rec.note, rec.dur, false);
  });

  document.getElementById('recommendMelodyBtn').addEventListener('click', async ()=>{
    try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){ console.warn(e); }
    const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
    if (idx < 0){ flashError('추천할 빈 마디가 없습니다'); return; }
    let remaining = BEATS_PER_MEASURE - measures[idx].reduce((s,n)=>s+n.beats,0);
    const key = document.getElementById('keySelect').value;
    const scale = scales[key];
    let cur = Math.floor(scale.length/2);
    while (remaining > 0){
      // pick duration fitting remaining
      const possible = ['q','h','8','w'].filter(d=>beatsFor(d) <= remaining).sort((a,b)=>beatsFor(b)-beatsFor(a));
      const d = possible[0] || 'q';
      // stepwise motion
      const step = Math.floor(Math.random()*3)-1;
      cur = Math.max(0, Math.min(scale.length-1, cur + step));
      addNoteToMeasure(idx, scale[cur], d, false);
      remaining -= beatsFor(d);
    }
    setStatus('추천 멜로디 적용', 'ok', true);
  });

  // Solfeggio buttons (도레미) with octave control (min 2)
  document.querySelectorAll('.solfeggio button[data-solf]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){ console.warn(e); }
      const map = { do:0, re:1, mi:2, fa:3, sol:4, la:5, si:6 };
      const deg = map[btn.getAttribute('data-solf')];
      const key = document.getElementById('keySelect').value;
      const scale = scales[key];
      // find a note in scale at selected octave or nearest
      let candidate = scale.find(s => s.display.o === currentOctave && scales[key].indexOf(s) % 7 === deg);
      if (!candidate){
        // fallback pick degree deg in scale, set desired octave
        const base = scale[Math.max(0, Math.min(scale.length-1, deg))];
        candidate = { display: { s: base.display.s, a: base.display.a, o: currentOctave }, play: base.play.replace(/\d$/, String(currentOctave)) };
      } else {
        // ensure play octave matches currentOctave
        candidate = { display: { s: candidate.display.s, a: candidate.display.a, o: currentOctave }, play: candidate.play.replace(/\d$/, String(currentOctave)) };
      }
      const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
      if (idx < 0){ flashError('빈 마디가 없습니다.'); return; }
      addNoteToMeasure(idx, candidate, selectedDur, false);
    });
  });

  document.getElementById('octUp').addEventListener('click', ()=>{ if (currentOctave < MAX_OCTAVE) currentOctave++; document.getElementById('octDisplay').textContent = currentOctave; });
  document.getElementById('octDown').addEventListener('click', ()=>{ if (currentOctave > MIN_OCTAVE) currentOctave--; document.getElementById('octDisplay').textContent = currentOctave; });

  // duration buttons
  let selectedDur = 'q';
  let selectedIsRest = false;
  function setActiveButtons(){ document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active')); const el=document.getElementById('dur_'+selectedDur); if (el) el.classList.add('active'); }
  ['w','h','q','8'].forEach(d=>{
    const b = document.getElementById('dur_'+d);
    if (b) b.addEventListener('click', ()=>{ selectedIsRest=false; selectedDur=d; setActiveButtons(); });
    const rb = document.getElementById('rest_'+d);
    if (rb) rb.addEventListener('click', ()=>{ selectedIsRest=true; selectedDur=d; setActiveButtons(); });
  });
  setActiveButtons();

  // Sample mapping helpers
  async function findSampleName(baseUrl, note){
    const tries = [ note + '.mp3', encodeURIComponent(note) + '.mp3' ];
    const sharpToFlat = { 'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb' };
    const m = note.match(/^([A-G])([#b]?)(\d)$/);
    if (m && m[2] === '#'){
      const flat = sharpToFlat[m[1] + '#'];
      if (flat) tries.push(flat + m[3] + '.mp3', encodeURIComponent(flat + m[3]) + '.mp3');
    }
    for (const fn of tries){
      const url = baseUrl + fn;
      try{
        const r = await fetch(url, { method:'HEAD' });
        if (r && r.status === 200) return fn;
      }catch(e){}
    }
    return null;
  }
  async function buildMapping(baseUrl, notes){
    const mapping = {};
    for (const n of notes){
      try{ const fn = await findSampleName(baseUrl, n); if (fn) mapping[n] = fn; }catch(e){ console.warn('mapping error', n, e); }
    }
    return mapping;
  }

  async function loadMelodySampler(instr, notes){
    samplerReady = false;
    if (melodySampler){ try{ melodySampler.dispose(); }catch(e){} melodySampler = null; }
    const folder = instrMap[instr] || instr;
    const baseUrl = SF_BASE + folder + '-mp3/';
    try{
      setStatus('멜로디 샘플 확인 중...', 'loading', true);
      const urls = await buildMapping(baseUrl, notes);
      if (!urls || Object.keys(urls).length === 0){ setStatus('멜로디 샘플 없음(합성기 폴백)', 'err', true); return; }
      setStatus('멜로디 샘플 로드 중...', 'loading', true);
      melodySampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl, onload: ()=>{ samplerReady = true; setStatus('멜로디 샘플 준비', 'ok', true); }, onerror:(e)=>{ console.warn(e); setStatus('멜로디 샘플 오류(폴백)', 'err', true); } }).toDestination();
    }catch(e){ console.warn(e); setStatus('멜로디 샘플 로드 실패', 'err', true); }
  }

  async function loadAccompSampler(instr, notes){
    accompReady = false;
    if (accompSampler){ try{ accompSampler.dispose(); }catch(e){} accompSampler = null; }
    if (instr === 'none') return;
    const folder = instrMap[instr] || instr;
    const baseUrl = SF_BASE + folder + '-mp3/';
    try{
      setStatus('반주 샘플 확인 중...', 'loading', true);
      const urls = await buildMapping(baseUrl, notes.length>0?notes:['C4','E4','G4']);
      if (!urls || Object.keys(urls).length === 0){ setStatus('반주 샘플 없음(합성기 폴백)', 'err', true); return; }
      setStatus('반주 샘플 로드 중...', 'loading', true);
      accompSampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl, onload: ()=>{ accompReady = true; setStatus('반주 샘플 준비', 'ok', true); }, onerror:(e)=>{ console.warn(e); setStatus('반주 샘플 오류(폴백)', 'err', true); } });
      // connect sampler to accompGain
      accompSampler.connect(accompGain);
    }catch(e){ console.warn(e); setStatus('반주 샘플 로드 실패','err',true); }
  }

  // accompaniment scheduling
  function scheduleAccompanimentMeasure(startTime, measureIndex){
    const type = document.getElementById('accompSelect').value;
    if (type === 'none') return;
    const root = chooseChordRoot(measureIndex);
    const chord = triad(root, currentOctave);
    const beatSec = 60 / tempo;
    if (type === 'acoustic_grand_piano'){
      for (let b=0;b<4;b++){
        const t = startTime + b * beatSec;
        const arp = chord;
        for (let i=0;i<arp.length;i++){ const nt = t + i*(beatSec/6);
          if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease(arp[i], beatSec*0.8, nt); }catch(e){ synthPrimary.triggerAttackRelease(arp[i], beatSec*0.8, nt);} }
          else synthPrimary.triggerAttackRelease(arp[i], beatSec*0.8, nt);
        }
      }
    } else if (type === 'acoustic_guitar_nylon'){
      for (let b=0;b<4;b++){
        const t = startTime + b * beatSec;
        for (let i=0;i<chord.length;i++){ const nt = t + i*0.02;
          if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease(chord[i], beatSec*0.95, nt); }catch(e){ synthPrimary.triggerAttackRelease(chord[i], beatSec*0.95, nt);} }
          else synthPrimary.triggerAttackRelease(chord[i], beatSec*0.95, nt);
        }
      }
    } else if (type === 'drum_kit'){
      // attempt to use accompSampler mapped drum notes, else use synth fallback
      for (let b=0;b<4;b++){
        const t = startTime + b*beatSec;
        if (b%2===0){
          if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease('C2',0.12,t); }catch(e){ kickSynth.triggerAttackRelease('C2', 0.12, t); } }
          else kickSynth.triggerAttackRelease('C2', 0.12, t);
        } else {
          if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease('D2',0.12,t); }catch(e){ snareSynth.triggerAttackRelease('C4', 0.12, t); } }
          else snareSynth.triggerAttackRelease('C4', 0.12, t);
        }
        const t2 = t + beatSec/2;
        if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease('G4',0.06,t); accompSampler.triggerAttackRelease('G4',0.06,t2); }catch(e){ hhSynth.triggerAttackRelease('G4',0.06,t); hhSynth.triggerAttackRelease('G4',0.06,t2); } }
        else { hhSynth.triggerAttackRelease('G4',0.06,t); hhSynth.triggerAttackRelease('G4',0.06,t2); }
      }
    }
  }

  function scheduleAllAndStart(){
    Tone.Transport.cancel();
    const beatSec = 60/tempo;
    let t = Tone.now() + 0.06;
    for (let m=0;m<NUM_MEASURES;m++){
      (function(measureIndex, startT){
        Tone.Transport.schedule((time)=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); const boxes=document.querySelectorAll('.measure-box'); if (boxes[measureIndex]) boxes[measureIndex].classList.add('active'); }, startT - (Tone.now()+0.06));
        Tone.Transport.schedule((time)=>{ scheduleAccompanimentMeasure(time, measureIndex); }, startT - (Tone.now()+0.06));
        let inner = startT;
        for (const note of measures[measureIndex]){
          const durSec = note.beats * beatSec;
          (function(nobj, at){ Tone.Transport.schedule((time)=>{ if (!nobj.isRest) playMelodyNote(nobj.pitch.play, nobj.beats * beatSec, time); }, at - (Tone.now()+0.06)); })(note, inner);
          inner += durSec;
        }
      })(m, t);
      t += 4 * beatSec;
    }
    Tone.Transport.schedule((time)=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); try{ Tone.Transport.stop(); }catch(e){} }, t - (Tone.now()+0.06));
    try{ Tone.Transport.start(); }catch(e){ console.warn('Transport start error', e); }
  }

  // chord helpers
  function chooseChordRoot(measureIdx){
    const key = document.getElementById('keySelect').value;
    const counts = {};
    for (const n of measures[measureIdx]) if (!n.isRest && n.pitch && n.pitch.play){ const m = n.pitch.play.match(/^([A-G][#b]?)/); const pc = m?m[0]:n.pitch.play; counts[pc] = (counts[pc]||0)+1; }
    if (!Object.keys(counts).length) return key;
    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    return entries[0][0];
  }
  function triad(root, oct){
    const semis = { C:0,'C#':1,Db:1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11 };
    const findName = val=>{ for (const p in semis) if (semis[p]===val) return p; return 'C'; };
    const mapping = { Bb:'A#' }; const r = mapping[root] || root; const idx = semis[r]!==undefined?semis[r]:0; const third=(idx+4)%12; const fifth=(idx+7)%12; return [findName(idx)+oct, findName(third)+oct, findName(fifth)+oct];
  }

  // recommend and solfeggio handlers already set below
  // Save/load/export simplified (kept working)
  document.getElementById('saveJsonBtn').addEventListener('click', ()=>{
    try{
      const obj = { key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) || 100 };
      const blob = new Blob([JSON.stringify(obj,null,2)], { type:'application/json' });
      const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href = url; a.download = '활동내용.json'; a.click(); URL.revokeObjectURL(url);
    }catch(e){ console.warn(e); flashError('저장 실패'); }
  });
  document.getElementById('loadJsonBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', ev=>{
    const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = ()=>{ try{ const obj = JSON.parse(r.result); if (!obj.measures) throw 'invalid'; for (let i=0;i<NUM_MEASURES && i<obj.measures.length;i++) measures[i]=obj.measures[i]; if (obj.key) document.getElementById('keySelect').value=obj.key; if (obj.tempo) document.getElementById('tempoInput').value=obj.tempo; renderAll(); setStatus('불러오기 완료','ok',true); } catch(e){ alert('불러오기 실패'); } };
    r.readAsText(f); ev.target.value='';
  });

  document.getElementById('exportMidiBtn').addEventListener('click', ()=>{
    try{
      const midi = new Midi(); const track = midi.addTrack(); const tempoVal = parseInt(document.getElementById('tempoInput').value) || 100; midi.header.setTempo(tempoVal);
      let currentTime = 0; const secPerBeat = 60/tempoVal;
      for (let m=0;m<NUM_MEASURES;m++){
        for (const n of measures[m]){
          const durSec = n.beats * secPerBeat;
          if (!n.isRest) track.addNote({ name: n.pitch.play, time: currentTime, duration: durSec, velocity: 0.9 });
          currentTime += durSec;
        }
      }
      const midiData = midi.toArray(); const blob = new Blob([midiData], { type:'audio/midi' }); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href = url; a.download = '나의_음악.mid'; a.click(); URL.revokeObjectURL(url);
      setStatus('MIDI 생성 완료', 'ok', true);
    }catch(e){ console.warn(e); flashError('MIDI 생성 실패'); }
  });

  // play/stop with user gesture guarantee
  document.getElementById('playBtn').addEventListener('click', async ()=>{
    try{ await Tone.start(); if (Tone.context && Tone.context.state === 'suspended') await Tone.context.resume(); }catch(e){ console.warn('Tone.start failed', e); }
    tempo = parseInt(document.getElementById('tempoInput').value) || 100;
    const uniq = new Set(); for (const m of measures) for (const n of m) if (!n.isRest && n.pitch && n.pitch.play) uniq.add(n.pitch.play);
    const usedNotes = Array.from(uniq);
    const instr = document.getElementById('instrSelect').value; if (usedNotes.length>0) loadMelodySampler(instr, usedNotes);
    const accomp = document.getElementById('accompSelect').value; if (accomp !== 'none') loadAccompSampler(accomp, usedNotes);
    scheduleAllAndStart();
  });

  document.getElementById('stopBtn').addEventListener('click', ()=>{
    try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){}
    try{ if (synthPrimary){ synthPrimary.releaseAll(); synthPrimary.dispose(); } }catch(e){}
    initSynth();
    setStatus('정지', 'ok', true);
  });

  // solfeggio initial bindings (done above)
  document.querySelectorAll('.solfeggio button[data-solf]').forEach(btn=>{
    // already bound earlier via inline; keep these safe duplicates if needed
  });

  // initial render
  renderAll();

  // expose key functions globally (for onclick strings)
  window.addNoteToMeasure = addNoteToMeasure;
  window.clearMeasure = clearMeasure;
  window.renderAll = renderAll;
  window.playMelodyNote = playMelodyNote;
  window.setActiveButtons = setActiveButtons;
  window.loadMelodySampler = loadMelodySampler;
  window.loadAccompSampler = loadAccompSampler;
  window.scheduleAllAndStart = scheduleAllAndStart;

  setStatus('준비 완료 — 오선이 보이면 음표를 추가해보세요. (첫 재생은 버튼 클릭으로 오디오 권한 필요)', 'ok', true);

})(); // end main
</script>
