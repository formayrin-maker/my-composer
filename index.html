
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>도전, 나도 작곡가!</title>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--fg:#111}
body{font-family:Inter, "Segoe UI", Roboto, Arial, sans-serif;background:var(--bg);color:var(--fg);margin:16px}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:18px;border-radius:10px;border:1px solid #e6eef8}
h1{color:var(--primary);text-align:center;margin:0 0 12px}
.toolbar-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start;margin-bottom:8px}
.toolbar-bottom{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px}
select,button,input[type=number]{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;cursor:pointer}
button.primary{background:var(--primary);color:#fff;border:0}
button.danger{background:#ef4444;color:#fff;border:0}
.note-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.dur-btn{padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
.dur-btn.active{background:var(--primary);color:#fff}
#score-container{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.measure-box{border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:#fff;min-height:140px;position:relative;display:flex;flex-direction:column;align-items:center}
.measure-box>div{touch-action:none;-ms-touch-action:none}
.measure-header{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#556;margin-bottom:6px}
.status{margin-top:8px;padding:8px;border-radius:8px;text-align:center}
.loading{background:#fef08a;color:#854d0e}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.measure-box.active{box-shadow:0 0 0 3px rgba(37,99,235,0.08);border-color:var(--primary)}
.measure-box.dragging{outline:3px dashed rgba(37,99,235,0.18)}
.note-hint{position:absolute;right:8px;top:32px;font-size:12px;color:#777}
.solfeggio{display:flex;gap:6px;align-items:center}
.solfeggio button{padding:6px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:700}
.solfeggio .oct{display:flex;gap:6px;align-items:center;margin-left:8px}
.small{font-size:13px;color:#556}
</style>

<!-- VexFlow loader -->
<script>
(function(){
  if (window.Vex && window.Vex.Flow){ window.__vex_ready=true; return; }
  window.__vex_ready=false;
  function loadScript(u){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=u; s.async=true; s.onload=()=>res(u); s.onerror=()=>rej(u); document.head.appendChild(s); }); }
  (async function(){
    const urls=['https://unpkg.com/vexflow@4.2.3/releases/vexflow-min.js','https://cdn.jsdelivr.net/npm/vexflow@4.2.3/releases/vexflow-min.js'];
    for (const u of urls){ try{ await loadScript(u); if (window.Vex && window.Vex.Flow){ window.__vex_ready=true; console.info('VexFlow loaded',u); break; } }catch(e){ console.warn('VexFlow fail',u); } }
    if (!window.__vex_ready) console.error('VexFlow failed to load');
  })();
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
</head>
<body>
<div class="wrap">
  <h1>🎼 도전, 나도 작곡가!</h1>

  <div class="toolbar-top">
    <label>조성:
      <select id="keySelect">
        <option value="C">다장조 (C)</option>
        <option value="G">사장조 (G)</option>

    <label>연주 악기:
      <select id="instrSelect">
        <option value="acoustic_grand_piano">피아노</option>
        <option value="flute">플루트</option>
        <option value="acoustic_guitar_nylon">어쿠스틱 기타</option>
        <option value="electric_guitar_clean">일렉 기타</option>
        <option value="violin">바이올린</option>

    <label>반주 악기:
      <select id="accompSelect">
        <option value="none">없음</option>
        <option value="acoustic_grand_piano">피아노</option>

  <div class="toolbar-bottom">
    <button id="playBtn" class="primary">▶ 전체 재생</button>
    <button id="stopBtn">■ 정지</button>
    <button id="undoBtn">↩️ 실행 취소</button>
    <button id="clearAllBtn" class="danger">🗑️ 모두 지우기</button>
  </div>

  <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:8px">
    <label>템포 <span class="small">(빠르기)</span>: <input id="tempoInput" type="number" value="100" min="40" max="240" style="width:90px"></label>
    <button id="saveJsonBtn" style="background:#10b981;color:white;border:0">💾 저장</button>
    <button id="loadJsonBtn" style="background:#06b6d4;color:white;border:0">📂 불러오기</button>
    <input id="fileInput" type="file" accept=".json" style="display:none">
    <button id="exportPngBtn">🖼️ 악보 저장</button>

  <div class="note-tools">
    <div style="text-align:center">
      <div style="font-weight:800;margin-bottom:6px">음표</div>
      <button class="dur-btn" id="dur_w">온음표 (4박)</button>
      <button class="dur-btn" id="dur_h">2분음표 (2박)</button>

      <div style="font-weight:800;margin-bottom:6px">쉼표</div>
      <button class="dur-btn" id="rest_w">온쉼표 (4박)</button>
      <button class="dur-btn" id="rest_h">2분쉼표 (2박)</button>
      <button class="dur-btn" id="rest_q">4분쉼표 (1박)</button>
      <button class="dur-btn" id="rest_8">8분쉼표 (0.5박)</button>
    </div>

    <div style="display:flex;flex-direction:column;justify-content:center;border-left:1px dashed #e2e8f0;padding-left:12px">
      <div style="margin-bottom:6px"><button id="recommendNoteBtn" class="primary">✨ 추천 음표</button></div>
      <div><button id="recommendMelodyBtn" class="primary" style="background:#8b5cf6">🎵 추천 멜로디</button></div>

  <div style="display:flex;justify-content:center;margin-bottom:10px;gap:12px;align-items:center">
    <div class="solfeggio">
      <button data-solf="do">도</button>
      <button data-solf="re">레</button>
      <button data-solf="mi">미</button>

        <button id="octDown">－</button>

      </div>
    </div>
  </div>

  <div id="status" class="status loading">로딩 중... 오선이 보이면 준비된 것입니다.</div>

  <div id="score-container"></div>
</div>

<script>
/* 업데이트된 기능 반영 스크립트(피아노 아르페지오 우선, 추천 다양화/반복방지/화음 고려, 버튼 재배치, 쉼표 활성 표시) */

(async function(){
  // wait for VexFlow
  const waitForVex = async(timeout=8000) => {
    const s = Date.now();
    while (Date.now() - s < timeout) {
      if (window.Vex && window.Vex.Flow) return true;
      await new Promise(r=>setTimeout(r,100));
    }
    return !!(window.Vex && window.Vex.Flow);
  };
  if (!await waitForVex(8000)){
    document.getElementById('status').textContent = 'VexFlow 로드 실패 — 네트워크 확인';
    document.getElementById('status').className = 'status err';
    return;
  }

  // 기본 상태
  const NUM_MEASURES = 8;
  const BEATS_PER_MEASURE = 4;
  const beatValue = { w:4, h:2, q:1, '8':0.5 };
  let tempo = 100;
  let currentOctave = 4;
  const MIN_OCTAVE = 3, MAX_OCTAVE = 5;
  const MAX_DRAG_DELTA = 2;

  const measures = Array.from({length:NUM_MEASURES}, ()=>[]);
  const history = [];

  const SF_BASE = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';
  const instrMap = { acoustic_grand_piano:'acoustic_grand_piano', flute:'flute', acoustic_guitar_nylon:'acoustic_guitar_nylon', electric_guitar_clean:'electric_guitar_clean', violin:'violin', xylophone:'xylophone' };

  // audio
  let synthPrimary = null, melodySampler = null, samplerReady = false;
  const accompGain = new Tone.Gain(0.35).toDestination();
  const drumGain = new Tone.Gain(0.14).toDestination();
  let accompSampler = null, accompReady = false;

  const kickSynth = new Tone.MembraneSynth({ pitchDecay:0.01, octaves:2, envelope:{ attack:0.001, decay:0.6, sustain:0.01, release:0.1 } }).connect(drumGain);
  const snareSynth = new Tone.NoiseSynth({ noise:{ type:'white' }, envelope:{ attack:0.001, decay:0.18, sustain:0 } }).connect(drumGain);
  const hhSynth = new Tone.MetalSynth({ frequency:700, envelope:{ attack:0.001, decay:0.08, release:0.01 }, harmonicity:5.1 }).connect(drumGain);

  function setStatus(text, cls='ok'){ const el=document.getElementById('status'); el.textContent=text; el.className='status '+cls; }
  function flashError(msg){ const el=document.getElementById('status'); el.textContent=msg; el.className='status err'; setTimeout(()=>setStatus('작성 계속하세요!','ok'),2200); }

  function initSynth(){ try{ if (synthPrimary) synthPrimary.dispose(); }catch(e){} synthPrimary = new Tone.PolySynth(Tone.Synth, { maxPolyphony:8 }).toDestination(); synthPrimary.set({ voice:{ envelope:{ attack:0.01, decay:0.1, sustain:0.9, release:0.2 } } }); setStatus('합성기 준비됨','ok'); }
  initSynth();

  // ducking
  const DRUM_NORMAL = 0.14, DRUM_DUCK = 0.05;
  function duckDrums(durationSec){
    try{
      drumGain.gain.cancelScheduledValues(Tone.now());
      drumGain.gain.setValueAtTime(drumGain.gain.value, Tone.now());
      drumGain.gain.linearRampToValueAtTime(DRUM_DUCK, Tone.now()+0.01);
      drumGain.gain.linearRampToValueAtTime(DRUM_NORMAL, Tone.now()+durationSec+0.03);
    }catch(e){ console.warn('duck error', e); }
  }

  // play melody note (with duck)
  function playMelodyNote(name, dur, at){
    duckDrums(dur);
    try{ if (samplerReady && melodySampler) melodySampler.triggerAttackRelease(name, dur, at); else synthPrimary.triggerAttackRelease(name, dur, at); }catch(e){ try{ synthPrimary.triggerAttackRelease(name, dur, at); }catch(_){ } }
  }
  window.playMelodyNote = playMelodyNote;

  // VexFlow render & handlers
  const VF = window.Vex.Flow;
  function noteToVexKey(note){ if (!note) return 'b/4'; const d=note.display; const acc=(d.a==='#')?'#':(d.a==='b'?'b':''); return d.s + acc + '/' + d.o; }
  let isPointerDown = false;

  function renderAll(){
    const scoreContainer = document.getElementById('score-container');
    scoreContainer.innerHTML = '';
    const key = document.getElementById('keySelect').value;
    const wrap = document.querySelector('.wrap');
    const wrapW = Math.min(wrap.clientWidth,1100);
    const cols = 4, gap = 12;
    const measureOuter = Math.floor((wrapW - (cols - 1) * gap) / cols);
    const staveWidth = Math.max(120, Math.min(360, measureOuter - 16));
    const availableWidth = Math.max(40, Math.floor(staveWidth * 0.66));

    for (let i=0;i<NUM_MEASURES;i++){
      const box=document.createElement('div'); box.className='measure-box';
      const header=document.createElement('div'); header.className='measure-header';
      header.innerHTML = '<span>' + (i+1) + '마디</span><button onclick="clearMeasure('+i+')">&#128465;</button>';
      box.appendChild(header);
      const div=document.createElement('div'); div.style.width=(staveWidth+20)+'px'; div.style.height='160px';
      box.appendChild(div);
      const hint=document.createElement('div'); hint.className='note-hint'; hint.textContent='(빈칸 클릭 = 추가 · 음표 클릭→드래그 = 높이 변경)';
      box.appendChild(hint);
      scoreContainer.appendChild(box);

      try{
        const renderer=new VF.Renderer(div, VF.Renderer.Backends.SVG);
        renderer.resize(staveWidth+20,160);
        const ctx=renderer.getContext();
        const stave=new VF.Stave(10,28,staveWidth);
        if (i===0) stave.addClef('treble').addTimeSignature('4/4');
        stave.addKeySignature(key);
        stave.setContext(ctx).draw();

        const notes = measures[i].map(n=>{
          const k=n.isRest?'b/4':noteToVexKey(n.pitch);
          const d=n.isRest?(n.duration+'r'):n.duration;
          return new VF.StaveNote({ clef:'treble', keys:[k], duration:d, auto_stem:true });
        });
        const voice=new VF.Voice({ num_beats:BEATS_PER_MEASURE, beat_value:4 });
        voice.setStrict(false);
        if (notes.length>0){ voice.addTickables(notes); new VF.Formatter().joinVoices([voice]).format([voice], availableWidth); voice.draw(ctx, stave); }
        else { const placeholder=[ new VF.StaveNote({ clef:'treble', keys:['b/4'], duration:'wr' }) ]; const v2=new VF.Voice({ num_beats:4, beat_value:4 }); v2.setStrict(false); v2.addTickables(placeholder); new VF.Formatter().joinVoices([v2]).format([v2], availableWidth); v2.draw(ctx, stave); }
      }catch(e){ console.error(e); setStatus('악보 렌더 오류','err'); }

      // pointer handlers...
      div.addEventListener('pointerdown', async function(ev){
        ev.preventDefault(); try{ this.setPointerCapture(ev.pointerId);}catch(e){}
        for (let p=0;p<i;p++){ const sum=measures[p].reduce((s,n)=>s+n.beats,0); if (sum < BEATS_PER_MEASURE){ flashError((p+1)+'마디를 먼저 채워주세요.'); try{ this.releasePointerCapture(ev.pointerId);}catch(e){} return; } }
        isPointerDown=true;
        try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){}
        const rect=this.getBoundingClientRect(); this._pointerStart={ x:ev.clientX-rect.left, y:ev.clientY-rect.top, rect:rect, measureIdx:i };
      }, { passive:false });

      div.addEventListener('pointermove', function(ev){
        if (!isPointerDown) return;
        const start=this._pointerStart; if (!start) return;
        const rect=start.rect; const dx=(ev.clientX-(rect.left+start.x)); const dy=(ev.clientY-(rect.top+start.y)); const dist=Math.sqrt(dx*dx+dy*dy);
        if (!this._draggingStarted && dist>6){
          if (measures[i].length>0){
            const slotW=rect.width/measures[i].length; const px=ev.clientX-rect.left;
            let nearestIdx=Math.floor(px/slotW); nearestIdx=Math.max(0,Math.min(measures[i].length-1,nearestIdx));
            this._draggingStarted={ noteIdx:nearestIdx, fromPitch: measures[i][nearestIdx].isRest ? null : measures[i][nearestIdx].pitch };
            this.parentElement.classList.add('dragging');
          }
        }
        if (this._draggingStarted){
          const rect2=this.getBoundingClientRect(); const y=ev.clientY-rect2.top; const scale=window.scales[document.getElementById('keySelect').value];
          let slot=Math.floor(((y-30)/(rect2.height-40))*scale.length); slot=Math.max(0,Math.min(scale.length-1,slot));
          const n=measures[i][this._draggingStarted.noteIdx]; if (!n || n.isRest) return;
          const prevIdx=scale.findIndex(s=>s.play === n.pitch.play); let finalIdx=slot;
          if (prevIdx>=0 && Math.abs(slot-prevIdx) > MAX_DRAG_DELTA) finalIdx = prevIdx + Math.sign(slot-prevIdx) * MAX_DRAG_DELTA;
          const finalNote = scale[finalIdx]; if (!finalNote) return;
          if (n.pitch.play !== finalNote.play){ n.pitch = { display: finalNote.display, play: finalNote.play }; renderAll(); }
        }
      }, { passive:false });

      div.addEventListener('pointerup', function(ev){
        try{ this.releasePointerCapture(ev.pointerId);}catch(e){}
        isPointerDown=false;
        if (this._draggingStarted){
          this.parentElement.classList.remove('dragging'); this._draggingStarted=null; this._pointerStart=null; history.push({ type:'move', measure:i }); renderAll(); return;
        }
        const start=this._pointerStart;
        if (start){
          const rect2=start.rect; const y=ev.clientY-rect2.top; const scale=window.scales[document.getElementById('keySelect').value];
          let slot=Math.floor(((y-30)/(rect2.height-40))*scale.length); slot=Math.max(0,Math.min(scale.length-1,slot));
          const noteObj=scale[slot];
          addNoteToMeasure(i,noteObj,selectedDur,selectedIsRest); this._pointerStart=null;
        }
      }, { passive:false });

      div.addEventListener('pointercancel', function(ev){ try{ this.releasePointerCapture(ev.pointerId);}catch(e){} isPointerDown=false; this._pointerStart=null; this._draggingStarted=null; }, { passive:false });
    }
  }
  window.renderAll = renderAll;

  // add note
  function addNoteToMeasure(measureIdx, scaleNoteObj, durKey, isRest){
    if (measureIdx<0||measureIdx>=NUM_MEASURES) return false;
    const beats = beatValue[durKey];
    const sum = measures[measureIdx].reduce((s,n)=>s+n.beats,0);
    if (sum + beats > BEATS_PER_MEASURE){ flashError((measureIdx+1)+'마디 박자 초과'); return false; }
    const stored = isRest ? { pitch:null, duration:durKey, beats:beats, isRest:true } : { pitch:{ display: scaleNoteObj.display, play: scaleNoteObj.play }, duration:durKey, beats:beats, isRest:false };
    measures[measureIdx].push(stored);
    history.push({ type:'add', measure: measureIdx });
    if (!isRest){
      const durSec = beats * (60/tempo);
      playMelodyNote(stored.pitch.play, durSec, Tone.now());
    }
    try{ localStorage.setItem('composer_autosave_v6', JSON.stringify({ key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value) })); }catch(e){}
    renderAll();
    return true;
  }
  window.addNoteToMeasure = addNoteToMeasure;

  function clearMeasure(idx){ if (measures[idx].length===0) return; if (!confirm((idx+1)+'마디를 지우시겠습니까?')) return; const prev=JSON.parse(JSON.stringify(measures[idx])); measures[idx]=[]; history.push({ type:'clear', measure: idx, prev: prev }); renderAll(); }
  window.clearMeasure = clearMeasure;

  // build scales once
  (function buildScalesOnce(){
    if (window.scales) return;
    const semitoneMaster=(function(){ const out=[]; const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; for (let o=MAX_OCTAVE;o>=MIN_OCTAVE;o--) for (const n of names) out.push(n+o); return out; })();
    function buildForKey(key){
      const tonicMap={C:0,G:7,F:5}; const pcMap={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11}; const diat=[0,2,4,5,7,9,11]; const t=tonicMap[key]; const out=[];
      for (const nm of semitoneMaster){ const namePart=nm.slice(0,-1); const oct=parseInt(nm.slice(-1),10); const pc=pcMap[namePart]; const rel=(pc-t+12)%12; if (diat.indexOf(rel)>=0){ let disp=namePart; if (key==='F' && namePart==='A#') disp='Bb'; const acc = disp.length>1 ? (disp[1]==='#'?'#':'b') : ''; out.push({ display:{ s:disp[0].toLowerCase(), a:acc, o:oct }, play: disp + oct }); } }
      return out;
    }
    window.scales = { C: buildForKey('C'), G: buildForKey('G'), F: buildForKey('F') };
  })();

  // recommendation improvements
  const recState = { lastNoteSig:null, melodyHistory:[] };
  function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function beatsFor(d){ return beatValue[d] || 1; }

  function recommendNoteForCurrentMeasure(){
    const key = document.getElementById('keySelect').value;
    const scale = window.scales[key];
    const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
    if (idx < 0) return null;
    // prior pitch
    let prev = null; for (let i=0;i<NUM_MEASURES;i++) if (measures[i].length>0) prev = measures[i][measures[i].length-1];
    let baseIdx = Math.floor(scale.length/2);
    if (prev && prev.pitch) { const pidx = scale.findIndex(s=>s.play===prev.pitch.play); if (pidx>=0) baseIdx = pidx; }
    const step = (Math.random()<0.75) ? (Math.floor(Math.random()*3)-1) : (Math.floor(Math.random()*5)-2);
    let candidateIdx = Math.max(0, Math.min(scale.length-1, baseIdx + step));
    // choose duration variety
    const durPool = ['q','q','h','q','8','8'];
    let dur = randChoice(durPool);
    if (Math.random() < 0.08) return { note:null, dur }; // occasional rest
    const candidate = scale[candidateIdx];
    const sig = candidate.play + ':' + dur;
    if (recState.lastNoteSig === sig){
      // avoid exact repeat: shift by 1
      candidateIdx = Math.max(0, Math.min(scale.length-1, candidateIdx + (Math.random()<0.5?-1:1)));
    }
    recState.lastNoteSig = scale[candidateIdx].play + ':' + dur;
    return { note: scale[candidateIdx], dur };
  }

  function recommendMelodyForCurrentMeasure(){
    const key = document.getElementById('keySelect').value;
    const scale = window.scales[key];
    const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
    if (idx < 0) return null;
    let remaining = BEATS_PER_MEASURE - measures[idx].reduce((s,n)=>s+n.beats,0);
    // determine chord of previous measure to bias notes
    const chordMode = document.getElementById('accompChordMode').value;
    const prevChordRoot = (idx>0) ? chooseChordRootForMeasure(idx-1, chordMode) : null;
    const chordNotes = prevChordRoot ? triad(prevChordRoot, currentOctave) : null;
    // starting index (from last note)
    let startIdx = Math.floor(scale.length/2);
    for (let i=0;i<NUM_MEASURES;i++) if (measures[i].length>0) startIdx = Math.max(0, Math.min(scale.length-1, scale.findIndex(s=>s.play===measures[i][measures[i].length-1].pitch.play) || startIdx));
    const pattern = [];
    // rhythm pool with weights favoring quarter + some eighth/half
    const durPool = ['q','q','h','q','8','q','8'];
    while (remaining > 0){
      let dur = randChoice(durPool);
      if (beatsFor(dur) > remaining){
        const smaller = durPool.find(d=>beatsFor(d) <= remaining);
        if (smaller) dur = smaller; else break;
      }
      // choose note: bias towards prev chord notes with probability, else stepwise
      let chosenNote = null;
      if (chordNotes && Math.random() < 0.6){
        // pick one chord tone, perhaps octave-adjusted
        const pick = randChoice(chordNotes);
        // find matching index in scale nearest to pick
        const baseIdx = scale.findIndex(s=>s.play.startsWith(pick.slice(0,-1)));
        if (baseIdx >= 0) chosenNote = scale[baseIdx];
      }
      if (!chosenNote){
        // stepwise movement from startIdx
        const move = (Math.random()<0.8)?(Math.floor(Math.random()*3)-1):(Math.floor(Math.random()*5)-2);
        startIdx = Math.max(0, Math.min(scale.length-1, startIdx + move));
        chosenNote = scale[startIdx];
      }
      if (Math.random() < 0.10){
        // occasional rest
        pattern.push({ note:null, dur }); remaining -= beatsFor(dur); continue;
      }
      // avoid exact repeat patterns recently
      const sig = (chosenNote ? chosenNote.play : 'r') + ':' + dur;
      if (recState.melodyHistory[recState.melodyHistory.length-1] === sig){
        // perturb
        const altIdx = Math.max(0, Math.min(scale.length-1, scale.findIndex(s=>s.play===chosenNote.play) + (Math.random()<0.5?-1:1)));
        chosenNote = scale[altIdx];
      }
      pattern.push({ note: chosenNote, dur });
      remaining -= beatsFor(dur);
    }
    const signature = pattern.map(p=> (p.note? p.note.play : 'r') + '-' + p.dur).join('|');
    if (recState.melodyHistory.includes(signature)){
      // small perturbation if repeated
      if (pattern.length>0 && pattern[0].note){
        const s0 = window.scales[key].findIndex(s=>s.play===pattern[0].note.play);
        const newIdx = Math.max(0, Math.min(window.scales[key].length-1, s0 + (Math.random()<0.5?-1:1)));
        pattern[0].note = window.scales[key][newIdx];
      }
    }
    recState.melodyHistory.push(signature);
    if (recState.melodyHistory.length > 8) recState.melodyHistory.shift();
    return pattern;
  }

  // sample helper functions reused
  async function findSampleName(baseUrl, note){
    const tries = [ note + '.mp3', encodeURIComponent(note) + '.mp3' ];
    const sharpToFlat = { 'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb' };
    const m = note.match(/^([A-G])([#b]?)(\d)$/);
    if (m && m[2] === '#'){
      const flat = sharpToFlat[m[1] + '#'];
      if (flat) tries.push(flat + m[3] + '.mp3', encodeURIComponent(flat + m[3]) + '.mp3');
    }
    for (const fn of tries){
      const url = baseUrl + fn;
      try{ const r = await fetch(url, { method:'HEAD' }); if (r && r.status === 200) return fn; }catch(e){}
    }
    return null;
  }
  async function buildMapping(baseUrl, notes){
    const mapping = {};
    for (const n of notes){
      try{ const fn = await findSampleName(baseUrl, n); if (fn) mapping[n] = fn; }catch(e){ console.warn('map check failed', n, e); }
    }
    return mapping;
  }

  async function loadMelodySampler(instr, notes){
    samplerReady = false;
    if (melodySampler){ try{ melodySampler.dispose(); }catch(e){} melodySampler = null; }
    const folder = instrMap[instr] || instr; const baseUrl = SF_BASE + folder + '-mp3/';
    setStatus('멜로디 샘플 확인 중...', 'loading');
    const urls = await buildMapping(baseUrl, notes);
    if (!urls || Object.keys(urls).length === 0){ setStatus('멜로디 샘플 없음(합성기 폴백)','err'); return; }
    setStatus('멜로디 샘플 로드 중...', 'loading');
    melodySampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl, onload: ()=>{ samplerReady = true; setStatus('멜로디 샘플 준비','ok'); }, onerror:(e)=>{ console.warn('melody sampler error', e); setStatus('멜로디 샘플 오류(폴백)','err'); } }).toDestination();
  }

  async function loadAccompSampler(instr, notes){
    accompReady = false;
    if (accompSampler){ try{ accompSampler.dispose(); }catch(e){} accompSampler=null; }
    if (instr === 'none'){ return; }
    const folder = instrMap[instr] || instr; const baseUrl = SF_BASE + folder + '-mp3/';
    setStatus('반주 샘플 확인 중...', 'loading');
    const urls = await buildMapping(baseUrl, notes.length>0?notes:['C4','E4','G4']);
    if (!urls || Object.keys(urls).length === 0){ setStatus('반주 샘플 없음(반주는 무음)', 'err'); return; }
    setStatus('반주 샘플 로드 중...', 'loading');
    accompSampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl, onload: ()=>{ accompReady = true; setStatus('반주 샘플 준비','ok'); }, onerror:(e)=>{ console.warn('accomp sampler error', e); setStatus('반주 샘플 오류(무음)','err'); } });
    accompSampler.connect(accompGain);
  }

  // schedule accompaniment uses arpeggio-first for piano (if accompReady), silent if not
  function scheduleAccompanimentMeasure(startTime, measureIndex){
    const type = document.getElementById('accompSelect').value;
    if (type === 'none') return;
    const chordMode = document.getElementById('accompChordMode').value;
    const root = chooseChordRootForMeasure(measureIndex, chordMode);
    const chord = triad(root, currentOctave);
    const beatSec = 60/tempo;

    // For piano: if accompReady use arpeggio pattern; if not ready -> silent
    if (type === 'acoustic_grand_piano'){
      if (!accompReady) return; // silent until real samples ready
      // arpeggio-per-beat pattern: beat0 root, beat1 (3rd->5th), beat2 root(octave), beat3 (3rd->5th)
      for (let b=0;b<4;b++){
        const t = startTime + b*beatSec;
        if (b===0){
          // subdivide into three quick arpeggio notes (root -> 3rd -> 5th)
          const notes = [ chord[0], chord[1], chord[2] ];
          for (let i=0;i<notes.length;i++){ const nt = t + i*0.06; try{ accompSampler.triggerAttackRelease(notes[i], beatSec*0.6, nt); }catch(e){} }
        } else if (b===1 || b===3){
          // play 3rd then 5th together (slight offset)
          try{ accompSampler.triggerAttackRelease(chord[1], beatSec*0.9, t+0.02); accompSampler.triggerAttackRelease(chord[2], beatSec*0.9, t+0.04); }catch(e){}
        } else if (b===2){
          // octave root (root + octave)
          const rootOct = chord[0].replace(/\d$/, String(currentOctave+1));
          try{ accompSampler.triggerAttackRelease(rootOct, beatSec*0.9, t+0.01); }catch(e){}
        }
      }
    } else if (type === 'acoustic_guitar_nylon'){
      // gentle strum if sampler ready
      if (!accompReady) return;
      for (let b=0;b<4;b++){
        const t = startTime + b*beatSec;
        for (let i=0;i<chord.length;i++){
          const nt = t + i*0.03;
          try{ accompSampler.triggerAttackRelease(chord[i], beatSec*0.95, nt); }catch(e){}
        }
      }
    } else if (type === 'drum_kit'){
      // drum plays (can use samples if mapping present else fallback synth)
      for (let b=0;b<4;b++){
        const t = startTime + b*beatSec;
        if (b%2===0){
          if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease('C2',0.12,t); }catch(e){ kickSynth.triggerAttackRelease('C2',0.12,t); } } else kickSynth.triggerAttackRelease('C2',0.12,t);
        } else {
          if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease('D2',0.12,t); }catch(e){ snareSynth.triggerAttackRelease('C4',0.12,t); } } else snareSynth.triggerAttackRelease('C4',0.12,t);
        }
        const t2 = t + beatSec/2;
        if (accompReady && accompSampler){ try{ accompSampler.triggerAttackRelease('G4',0.06,t); accompSampler.triggerAttackRelease('G4',0.06,t2); }catch(e){ hhSynth.triggerAttackRelease('G4',0.06,t); hhSynth.triggerAttackRelease('G4',0.06,t2); } }
        else { hhSynth.triggerAttackRelease('G4',0.06,t); hhSynth.triggerAttackRelease('G4',0.06,t2); }
      }
    }
  }

  // choose chord root for measure using primary weighting
  function chooseChordRootForMeasure(mi, chordMode){
    const key = document.getElementById('keySelect').value;
    const counts = {};
    for (const n of measures[mi]) if (!n.isRest && n.pitch && n.pitch.play){ const m = n.pitch.play.match(/^([A-G][#b]?)/); const pc = m?m[0]:n.pitch.play; counts[pc] = (counts[pc]||0)+1; }
    const map = { C:{I:'C',IV:'F',V:'G'}, G:{I:'G',IV:'C',V:'D'}, F:{I:'F',IV:'Bb',V:'C'} };
    const km = map[key] || map['C'];
    if (chordMode === 'primary'){
      // try to pick I or V first if present
      const candidates = [km.I, km.V, km.IV];
      for (const c of candidates){
        if (counts[c]) return c;
      }
      return km.I;
    } else {
      const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      if (entries.length>0) return entries[0][0];
      return km.I;
    }
  }

  // scheduleAllAndStart: only up to last measure with notes
  function scheduleAllAndStart(){
    Tone.Transport.cancel();
    const beatSec = 60/tempo;
    let lastIdx = -1;
    for (let i=NUM_MEASURES-1;i>=0;i--){ if (measures[i].some(n=>!n.isRest)) { lastIdx = i; break; } }
    if (lastIdx < 0){ flashError('재생할 음표가 없습니다'); return; }
    let t = Tone.now() + 0.06;
    for (let m=0;m<=lastIdx;m++){
      (function(measureIndex,startT){
        Tone.Transport.schedule((time)=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); const boxes=document.querySelectorAll('.measure-box'); if (boxes[measureIndex]) boxes[measureIndex].classList.add('active'); }, startT - (Tone.now()+0.06));
        Tone.Transport.schedule((time)=>{ scheduleAccompanimentMeasure(time, measureIndex); }, startT - (Tone.now()+0.06));
        let inner = startT;
        for (const note of measures[measureIndex]){
          const durSec = note.beats * beatSec;
          (function(nobj, at){ Tone.Transport.schedule((time)=>{ if (!nobj.isRest) playMelodyNote(nobj.pitch.play, nobj.beats * beatSec, time); }, at - (Tone.now()+0.06)); })(note, inner);
          inner += durSec;
        }
      })(m, t);
      t += 4 * beatSec;
    }
    Tone.Transport.schedule((time)=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); try{ Tone.Transport.stop(); }catch(e){} }, t - (Tone.now()+0.06));
    try{ Tone.Transport.start(); }catch(e){ console.warn('Transport start error', e); }
  }

  // Play: load samplers on user gesture; wait for melody sampler if samples exist; accomp waits but if not ready accompaniment stays silent
  document.getElementById('playBtn').addEventListener('click', async ()=>{
    try{ await Tone.start(); if (Tone.context && Tone.context.state === 'suspended') await Tone.context.resume(); }catch(e){ console.warn('Tone.start failed', e); }
    tempo = parseInt(document.getElementById('tempoInput').value) || 100;
    const uniq = new Set(); for (const m of measures) for (const n of m) if (!n.isRest && n.pitch && n.pitch.play) uniq.add(n.pitch.play);
    const used = Array.from(uniq);
    const instr = document.getElementById('instrSelect').value;
    const accomp = document.getElementById('accompSelect').value;
    setStatus('샘플 준비 중... (첫 마디부터 실음 보장)', 'loading');
    await loadMelodySampler(instr, used);
    await loadAccompSampler(accomp, used);
    // wait for melody sampler readiness (if samples expected)
    const start = Date.now();
    while (used.length>0 && !samplerReady && (Date.now()-start) < 4000){ await new Promise(r=>setTimeout(r,120)); }
    // wait a short time for accomp sampler, but if not ready accompaniment stays silent
    const start2 = Date.now();
    while (accomp !== 'none' && accompSampler && !accompReady && (Date.now()-start2) < 3000){ await new Promise(r=>setTimeout(r,120)); }
    setStatus('샘플 준비 완료 (반주: ' + (accompReady ? '실음' : '무음') + ')', 'ok', true);
    scheduleAllAndStart();
  });

  document.getElementById('stopBtn').addEventListener('click', ()=>{
    try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){}
    try{ if (synthPrimary){ synthPrimary.releaseAll(); synthPrimary.dispose(); } }catch(e){}
    initSynth(); setStatus('정지','ok');
  });

  // recommend note/melody handlers (use functions above)
  document.getElementById('recommendNoteBtn').addEventListener('click', async ()=>{
    try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){}
    const rec = recommendNoteForCurrentMeasure();
    if (!rec){ flashError('빈 마디가 없습니다'); return; }
    if (rec.note === null) {
      addNoteToMeasure(measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE), { display:{ s:'b', a:'', o:4 }, play:'' }, rec.dur, true);
    } else addNoteToMeasure(measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE), rec.note, rec.dur, false);
  });

  document.getElementById('recommendMelodyBtn').addEventListener('click', async ()=>{
    try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){}
    const pattern = recommendMelodyForCurrentMeasure();
    if (!pattern || pattern.length===0){ flashError('추천 멜로디 생성 불가'); return; }
    const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE);
    if (idx < 0){ flashError('빈 마디가 없습니다'); return; }
    for (const p of pattern){
      if (p.note === null) addNoteToMeasure(idx, { display:{ s:'b', a:'', o:4 }, play:'' }, p.dur, true);
      else addNoteToMeasure(idx, p.note, p.dur, false);
    }
    setStatus('추천 멜로디 적용','ok');
  });

  // durations UI + rest active indicator
  let selectedDur = 'q', selectedIsRest = false;
  function setActiveButtons(){
    document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active'));
    if (selectedIsRest){
      const el = document.getElementById('rest_'+selectedDur); if (el) el.classList.add('active');
    } else {
      const el = document.getElementById('dur_'+selectedDur); if (el) el.classList.add('active');
    }
  }
  ['w','h','q','8'].forEach(d=>{
    const el = document.getElementById('dur_'+d);
    if (el) el.addEventListener('click', ()=>{ selectedIsRest=false; selectedDur=d; setActiveButtons(); });
    const rel = document.getElementById('rest_'+d);
    if (rel) rel.addEventListener('click', ()=>{ selectedIsRest=true; selectedDur=d; setActiveButtons(); });
  });
  setActiveButtons();

  // solfeggio octave control
  document.getElementById('octUp').addEventListener('click', ()=>{ if (currentOctave < MAX_OCTAVE) currentOctave++; document.getElementById('octDisplay').textContent = currentOctave; });
  document.getElementById('octDown').addEventListener('click', ()=>{ if (currentOctave > MIN_OCTAVE) currentOctave--; document.getElementById('octDisplay').textContent = currentOctave; });

  // sampler helper functions (defined earlier)
  async function findSampleName(baseUrl, note){
    const tries = [ note + '.mp3', encodeURIComponent(note) + '.mp3' ];
    const sharpToFlat = { 'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb' };
    const m = note.match(/^([A-G])([#b]?)(\d)$/);
    if (m && m[2]==='#'){ const flat = sharpToFlat[m[1]+'#']; if (flat) tries.push(flat+m[3]+'.mp3', encodeURIComponent(flat+m[3])+'.mp3'); }
    for (const fn of tries){ try{ const r = await fetch(baseUrl+fn,{ method:'HEAD' }); if (r && r.status===200) return fn; }catch(e){} }
    return null;
  }
  async function buildMapping(baseUrl, notes){ const map={}; for (const n of notes){ try{ const fn = await findSampleName(baseUrl,n); if (fn) map[n]=fn; }catch(e){ console.warn('map error', e); } } return map; }

  // save/load/export functionality
  document.getElementById('saveJsonBtn').addEventListener('click', ()=>{
    try{ const obj = { key:document.getElementById('keySelect').value, measures:measures, tempo:parseInt(document.getElementById('tempoInput').value)||100 }; const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='활동내용.json'; a.click(); URL.revokeObjectURL(url); }catch(e){ console.warn(e); flashError('저장 실패'); }
  });
  document.getElementById('loadJsonBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', ev=>{ const f=ev.target.files[0]; if (!f) return; const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); if (!obj.measures) throw 'invalid'; for (let i=0;i<NUM_MEASURES && i<obj.measures.length;i++) measures[i]=obj.measures[i]; if (obj.key) document.getElementById('keySelect').value=obj.key; if (obj.tempo) document.getElementById('tempoInput').value=obj.tempo; renderAll(); setStatus('불러오기 완료','ok'); }catch(e){ alert('불러오기 실패'); } }; r.readAsText(f); ev.target.value=''; });

  document.getElementById('exportMidiBtn').addEventListener('click', ()=>{ try{ const midi=new Midi(); const track=midi.addTrack(); const tempoVal=parseInt(document.getElementById('tempoInput').value)||100; midi.header.setTempo(tempoVal); let time=0; const secPerBeat=60/tempoVal; for (let m=0;m<NUM_MEASURES;m++){ for (const n of measures[m]){ const dur = n.beats * secPerBeat; if (!n.isRest) track.addNote({ name:n.pitch.play, time:time, duration:dur, velocity:0.9 }); time += dur; } } const arr=midi.toArray(); const blob=new Blob([arr],{type:'audio/midi'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='나의_음악.mid'; a.click(); URL.revokeObjectURL(url); setStatus('MIDI 생성 완료','ok'); }catch(e){ console.warn(e); flashError('MIDI 생성 실패'); } });

})(); // end main
</script>
