<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>도전, 나도 작곡가!</title>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--fg:#111827}
body{font-family:Inter, system-ui, -apple-system, Roboto, "Helvetica Neue", Arial; background:var(--bg); color:var(--fg); margin:16px}
.wrap{max-width:1100px;margin:0 auto;background:#fff;padding:18px;border-radius:10px;border:1px solid #e6eef8}
h1{color:var(--primary);text-align:center;margin:0 0 12px}
.toolbar-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:8px}
.toolbar-bottom{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px}
select,button,input[type=number]{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;cursor:pointer}
button.primary{background:var(--primary);color:#fff;border:0}
button.danger{background:#ef4444;color:#fff;border:0}
.note-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.dur-btn{padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
.dur-btn.active{background:var(--primary);color:#fff}
#score-container{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.measure-box{border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:#fff;min-height:140px;position:relative;display:flex;flex-direction:column;align-items:center}
.measure-header{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#556;margin-bottom:6px}
.status{margin-top:8px;padding:8px;border-radius:8px;text-align:center}
.loading{background:#fef08a;color:#854d0e}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.measure-box.active{box-shadow:0 0 0 3px rgba(37,99,235,0.08);border-color:var(--primary)}
.note-hint{position:absolute;right:8px;top:32px;font-size:12px;color:#777}
.solfeggio{display:flex;gap:6px;align-items:center}
.solfeggio button{padding:6px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:700}
.solfeggio .oct{display:flex;gap:6px;align-items:center;margin-left:8px}
.small{font-size:13px;color:#556}
</style>
<!-- Load libraries -->
<script>
(function(){
  if (!window.__vex_loading){
    window.__vex_loading = true;
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/vexflow@4.2.3/releases/vexflow-min.js';
    s.async = true; document.head.appendChild(s);
  }
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
</head>
<body>
<div class="wrap">
  <h1>🎼 도전, 나도 작곡가!</h1>

  <div class="toolbar-top">
    <label>조성:
      <select id="keySelect">
        <option value="C">다장조 (C)</option>
        <option value="G">사장조 (G)</option>
        <option value="F">바장조 (F)</option>
      </select>
    </label>

    <label>연주 악기:
      <select id="instrSelect">
        <option value="acoustic_grand_piano">피아노</option>
        <option value="flute">플루트</option>
        <option value="acoustic_guitar_nylon">어쿠스틱 기타</option>
        <option value="electric_guitar_clean">일렉 기타</option>
        <option value="violin">바이올린</option>
        <option value="xylophone">실로폰</option>
      </select>
    </label>

    <label>반주 악기:
      <select id="accompSelect">
        <option value="none">없음</option>
        <option value="acoustic_grand_piano">피아노</option>
        <option value="acoustic_guitar_nylon">어쿠스틱 기타</option>
      </select>
    </label>

    <label>반주 화음:
      <select id="accompChordMode">
        <option value="primary" selected>1·4·5 우선 (권장)</option>
        <option value="all">모든 화음 허용</option>
      </select>
    </label>
  </div>

  <div class="toolbar-bottom">
    <button id="playBtn" class="primary">▶ 전체 재생</button>
    <button id="stopBtn">■ 정지</button>
    <button id="undoBtn">↩️ 실행 취소</button>
    <button id="clearAllBtn" class="danger">🗑️ 모두 지우기</button>
  </div>

  <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:8px">
    <label>템포 <span class="small">(빠르기)</span>: <input id="tempoInput" type="number" value="100" min="40" max="240" style="width:90px"></label>
    <button id="saveJsonBtn" style="background:#10b981;color:white;border:0">💾 저장</button>
    <button id="loadJsonBtn" style="background:#06b6d4;color:white;border:0">📂 불러오기</button>
    <input id="fileInput" type="file" accept=".json" style="display:none">
    <button id="exportPngBtn">🖼️ 악보 저장</button>
    <button id="exportMidiBtn" style="background:#f59e0b;color:white;border:0">🎹 음악 저장</button>
  </div>

  <div class="note-tools">
    <div style="text-align:center">
      <div style="font-weight:800;margin-bottom:6px">음표</div>
      <button class="dur-btn" id="dur_w">온음표 (4박)</button>
      <button class="dur-btn" id="dur_h">2분음표 (2박)</button>
      <button class="dur-btn active" id="dur_q">4분음표 (1박)</button>
      <button class="dur-btn" id="dur_8">8분음표 (0.5박)</button>
    </div>

    <div style="text-align:center;border-left:1px dashed #e2e8f0;padding-left:12px">
      <div style="font-weight:800;margin-bottom:6px">쉼표</div>
      <button class="dur-btn" id="rest_w">온쉼표 (4박)</button>
      <button class="dur-btn" id="rest_h">2분쉼표 (2박)</button>
      <button class="dur-btn" id="rest_q">4분쉼표 (1박)</button>
      <button class="dur-btn" id="rest_8">8분쉼표 (0.5박)</button>
    </div>

    <div style="display:flex;flex-direction:column;justify-content:center;border-left:1px dashed #e2e8f0;padding-left:12px">
      <div style="margin-bottom:6px"><button id="recommendNoteBtn" class="primary">✨ 추천 음표</button></div>
      <div><button id="recommendMelodyBtn" class="primary" style="background:#8b5cf6">🎵 추천 멜로디</button></div>
    </div>
  </div>

  <div style="display:flex;justify-content:center;margin-bottom:10px;gap:12px;align-items:center">
    <div class="solfeggio">
      <button data-solf="do">도</button>
      <button data-solf="re">레</button>
      <button data-solf="mi">미</button>
      <button data-solf="fa">파</button>
      <button data-solf="sol">솔</button>
      <button data-solf="la">라</button>
      <button data-solf="si">시</button>
      <div class="oct">
        <button id="octDown">－</button>
        <span id="octDisplay" style="min-width:22px;text-align:center;font-weight:700">4</span>
        <button id="octUp">＋</button>
      </div>
    </div>
  </div>

  <div id="status" class="status loading">로딩 중... 오선이 보이면 준비된 것입니다.</div>

  <div id="score-container"></div>
</div>

<script>
// Robust composer app
(function(){
  // Global safety handlers
  window.addEventListener('error', function(ev){
    try{ const st=document.getElementById('status'); if (st){ st.textContent='오류: '+(ev && ev.message?ev.message:ev.toString()); st.className='status err'; } console.error(ev.error||ev); }catch(e){console.error(e);} });
  window.addEventListener('unhandledrejection', function(ev){ try{ const st=document.getElementById('status'); if (st){ st.textContent='비동기 오류: '+(ev.reason&&ev.reason.message?ev.reason.message:String(ev.reason)); st.className='status err'; } console.error('UnhandledRejection', ev.reason); }catch(e){console.error(e);} });

  // Config
  const NUM_MEASURES = 8;
  const BEATS_PER_MEASURE = 4;
  const beatValue = { w:4, h:2, q:1, '8':0.5 };
  let tempo = 100;
  let currentOctave = 4; const MIN_OCTAVE=3, MAX_OCTAVE=5;
  const MAX_DRAG_DELTA = 2;

  // State
  const measures = Array.from({length:NUM_MEASURES}, ()=>[]);
  const history = [];

  // utility
  function setStatus(text, cls='ok'){ const el=document.getElementById('status'); if (el){ el.textContent=text; el.className='status '+cls; } }
  function flash(msg){ const el=document.getElementById('status'); if (el){ el.textContent=msg; el.className='status loading'; setTimeout(()=>setStatus('준비 완료','ok'),2200); } }

  // Ensure VexFlow available then init
  async function waitForVex(timeout=8000){ const start=Date.now(); while(Date.now()-start < timeout){ if (window.Vex && window.Vex.Flow) return true; await new Promise(r=>setTimeout(r,100)); } return !!(window.Vex && window.Vex.Flow); }

  // Build scales (limited octaves)
  const SCALES = (function(){ const out={}; function build(key){ const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const pcMap={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11}; const tonic={C:0,G:7,F:5}; const diat=[0,2,4,5,7,9,11]; const t = tonic[key]; const arr=[]; for (let o=MAX_OCTAVE;o>=MIN_OCTAVE;o--){ for (const n of names){ const pc=pcMap[n]; const rel=(pc - t + 12)%12; if (diat.indexOf(rel)>=0){ let disp=n; if (key==='F' && n==='A#') disp='Bb'; const acc = disp.length>1 ? (disp[1]==='#'?'#':'b') : ''; arr.push({ display:{ s:disp[0].toLowerCase(), a:acc, o:o }, play: disp + o }); } } } return arr; }
    out.C = build('C'); out.G = build('G'); out.F = build('F'); return out; })();

  // Audio & samplers
  let synthPrimary = null, melodySampler = null, samplerReady=false;
  let accompSampler = null, accompReady=false;
  const SF_BASE = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';
  const instrMap = { acoustic_grand_piano:'acoustic_grand_piano', flute:'flute', acoustic_guitar_nylon:'acoustic_guitar_nylon', electric_guitar_clean:'electric_guitar_clean', violin:'violin', xylophone:'xylophone' };

  function initSynth(){ try{ if (synthPrimary) synthPrimary.dispose(); }catch(e){} synthPrimary = new Tone.PolySynth(Tone.Synth, { maxPolyphony:8 }).toDestination(); synthPrimary.set({ voice:{ envelope:{ attack:0.01, decay:0.1, sustain:0.9, release:0.2 } } }); setStatus('합성기 준비됨','ok'); }
  initSynth();

  // triad util
  function triad(root, oct){ const semis = { C:0,'C#':1,Db:1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11 }; const names = Object.keys(semis); function findName(val){ for (const p in semis) if (semis[p]===val) return p; return 'C'; } const map={Bb:'A#'}; const r = map[root] || root; const idx = semis[r]!==undefined?semis[r]:0; const third=(idx+4)%12; const fifth=(idx+7)%12; return [ findName(idx)+oct, findName(third)+oct, findName(fifth)+oct ]; }

  // VexFlow render
  let renderAll = function(){ console.warn('renderAll not ready'); };

  // Build renderAll after VexFlow ready
  function buildRenderAll(){ const VF = window.Vex.Flow; renderAll = function(){ try{
      const scoreContainer = document.getElementById('score-container'); scoreContainer.innerHTML=''; const key = document.getElementById('keySelect').value; const wrap=document.querySelector('.wrap'); const wrapW=Math.min(wrap.clientWidth,1100); const cols=4,gap=12; const measureOuter=Math.floor((wrapW - (cols-1)*gap)/cols); const staveWidth=Math.max(120,Math.min(360,measureOuter-16)); const availableWidth=Math.max(40,Math.floor(staveWidth*0.66));
      for (let i=0;i<NUM_MEASURES;i++){ const box=document.createElement('div'); box.className='measure-box'; const header=document.createElement('div'); header.className='measure-header'; header.innerHTML = '<span>'+ (i+1) +'마디</span><button data-measure="'+i+'" class="btn-del">🗑️</button>'; box.appendChild(header); const div=document.createElement('div'); div.style.width=(staveWidth+20)+'px'; div.style.height='160px'; box.appendChild(div); const hint=document.createElement('div'); hint.className='note-hint'; hint.textContent='(빈칸 클릭 = 추가 · 음표 클릭→드래그 = 높이 변경)'; box.appendChild(hint); scoreContainer.appendChild(box);
        try{
          const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG); renderer.resize(staveWidth+20,160); const ctx = renderer.getContext(); const stave = new VF.Stave(10,28,staveWidth); if (i===0) stave.addClef('treble').addTimeSignature('4/4'); stave.addKeySignature(key); stave.setContext(ctx).draw();
          const notes = measures[i].map(n=>{ const k = n.isRest ? 'b/4' : (n.pitch ? (n.pitch.display.s + (n.pitch.display.a || '') + '/' + n.pitch.display.o) : 'b/4'); const d = n.isRest ? (n.duration+'r') : n.duration; return new VF.StaveNote({ clef:'treble', keys:[k], duration:d, auto_stem:true }); });
          const voice = new VF.Voice({ num_beats: BEATS_PER_MEASURE, beat_value: 4 }); voice.setStrict(false); if (notes.length>0){ voice.addTickables(notes); new VF.Formatter().joinVoices([voice]).format([voice], availableWidth); voice.draw(ctx, stave); } else { const placeholder=[ new VF.StaveNote({ clef:'treble', keys:['b/4'], duration:'wr' }) ]; const v2=new VF.Voice({ num_beats:4, beat_value:4 }); v2.setStrict(false); v2.addTickables(placeholder); new VF.Formatter().joinVoices([v2]).format([v2], availableWidth); v2.draw(ctx, stave); }
        }catch(e){ console.error(e); setStatus('악보 렌더 오류: '+(e.message||e),'err'); }
      }
      attachMeasureDeleteHandlers();
    }catch(e){ console.error('renderAll error', e); setStatus('렌더 오류: '+(e.message||e),'err'); }
  } }

  // Delete handlers
  function attachMeasureDeleteHandlers(){ document.querySelectorAll('.btn-del').forEach(btn=>{ btn.removeEventListener('click', onDelClick); btn.addEventListener('click', onDelClick); }); }
  function onDelClick(e){ const idx = parseInt(e.currentTarget.getAttribute('data-measure')); if (!Number.isFinite(idx)) return; if (!confirm((idx+1)+'마디를 지우시겠습니까?')) return; const prev = JSON.parse(JSON.stringify(measures[idx])); measures[idx]=[]; history.push({ type:'clear', measure: idx, prev }); try{ localStorage.setItem('composer_autosave', JSON.stringify({ measures })) }catch(_){} renderAll(); }

  // Add note
  function addNoteToMeasure(measureIdx, scaleNoteObj, durKey, isRest){ if (measureIdx<0||measureIdx>=NUM_MEASURES) return false; const beats = beatValue[durKey]; const sum = measures[measureIdx].reduce((s,n)=>s+n.beats,0); if (sum + beats > BEATS_PER_MEASURE){ flash((measureIdx+1)+'마디 박자 초과'); return false; } const stored = isRest ? { pitch:null, duration:durKey, beats:beats, isRest:true } : { pitch:{ display: scaleNoteObj.display, play: scaleNoteObj.play }, duration:durKey, beats:beats, isRest:false }; measures[measureIdx].push(stored); history.push({ type:'add', measure: measureIdx }); if (!isRest){ const durSec = beats * (60/tempo); playMelodyNote(stored.pitch.play, durSec, Tone.now()); } try{ localStorage.setItem('composer_autosave', JSON.stringify({ measures })); }catch(e){} renderAll(); return true; }

  // Play/Stop scheduling
  function scheduleAccompanimentMeasure(startTime, measureIndex){ const type = document.getElementById('accompSelect').value; if (type === 'none') return; const chordMode = document.getElementById('accompChordMode').value; const root = chooseChordRootForMeasure(measureIndex, chordMode); const chord = triad(root, currentOctave); const beatSec = 60/tempo; if (!accompReady && type !== 'drum') return; if (type === 'acoustic_grand_piano'){ for (let b=0;b<4;b++){ const t = startTime + b*beatSec; if (b===0){ const notes=[chord[0], chord[1], chord[2]]; for (let i=0;i<notes.length;i++){ const nt = t + i*0.06; try{ accompSampler.triggerAttackRelease(notes[i], beatSec*0.6, nt); }catch(e){} } } else if (b===2){ const rootOct = chord[0].replace(/\d$/, String(currentOctave+1)); try{ accompSampler.triggerAttackRelease(rootOct, beatSec*0.9, t+0.01); }catch(e){} } else { try{ accompSampler.triggerAttackRelease(chord[1], beatSec*0.9, t+0.02); accompSampler.triggerAttackRelease(chord[2], beatSec*0.9, t+0.04); }catch(e){} } } } else if (type==='acoustic_guitar_nylon'){ for (let b=0;b<4;b++){ const t=startTime+b*beatSec; for (let i=0;i<chord.length;i++){ const nt=t+i*0.03; try{ accompSampler.triggerAttackRelease(chord[i], beatSec*0.95, nt); }catch(e){} } } } else if (type==='drum'){ /* drums removed */ } }

  function chooseChordRootForMeasure(mi, chordMode){ const key=document.getElementById('keySelect').value; const counts={}; for (const n of measures[mi]) if (!n.isRest && n.pitch && n.pitch.play){ const m = n.pitch.play.match(/^([A-G][#b]?)/); const pc = m?m[0]:n.pitch.play; counts[pc]=(counts[pc]||0)+1; } const map={C:{I:'C',IV:'F',V:'G'}, G:{I:'G',IV:'C',V:'D'}, F:{I:'F',IV:'Bb',V:'C'}}; const km = map[key]||map.C; if (chordMode==='primary'){ const candidates=[km.I, km.V, km.IV]; for (const c of candidates) if (counts[c]) return c; return km.I; } else { const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]); if (entries.length>0) return entries[0][0]; return km.I; } }

  function scheduleAllAndStart(){ try{ Tone.Transport.cancel(); }catch(e){} const beatSec = 60/tempo; let lastIdx=-1; for (let i=NUM_MEASURES-1;i>=0;i--){ if (measures[i].some(n=>!n.isRest)) { lastIdx=i; break; } } if (lastIdx<0){ flash('재생할 음표가 없습니다'); return; } let t = Tone.now() + 0.06; for (let m=0;m<=lastIdx;m++){ (function(measureIndex,startT){ Tone.Transport.schedule((time)=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); const boxes=document.querySelectorAll('.measure-box'); if (boxes[measureIndex]) boxes[measureIndex].classList.add('active'); }, startT - (Tone.now()+0.06)); Tone.Transport.schedule((time)=>{ scheduleAccompanimentMeasure(time, measureIndex); }, startT - (Tone.now()+0.06)); let inner = startT; for (const note of measures[measureIndex]){ const durSec = note.beats * beatSec; (function(nobj, at){ Tone.Transport.schedule((time)=>{ if (!nobj.isRest) playMelodyNote(nobj.pitch.play, nobj.beats * beatSec, time); }, at - (Tone.now()+0.06)); })(note, inner); inner += durSec; } })(m, t); t += 4*beatSec; } Tone.Transport.schedule((time)=>{ document.querySelectorAll('.measure-box').forEach(b=>b.classList.remove('active')); try{ Tone.Transport.stop(); }catch(e){} }, t - (Tone.now()+0.06)); try{ Tone.Transport.start(); }catch(e){ console.warn('Transport start failed', e); } }

  // playMelodyNote
  function playMelodyNote(name, dur, at){ try{ if (samplerReady && melodySampler) melodySampler.triggerAttackRelease(name, dur, at); else synthPrimary.triggerAttackRelease(name, dur, at); }catch(e){ try{ synthPrimary.triggerAttackRelease(name, dur, at); }catch(_){} } }

  // Sample helpers
  async function findSampleName(baseUrl, note){ const tries=[note+'.mp3', encodeURIComponent(note)+'.mp3']; const sharpToFlat={'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'}; const m = note.match(/^([A-G])([#b]?)(\d)$/); if (m && m[2]==='#'){ const flat = sharpToFlat[m[1]+'#']; if (flat) tries.push(flat+m[3]+'.mp3', encodeURIComponent(flat+m[3])+'.mp3'); } for (const fn of tries){ try{ const r = await fetch(baseUrl+fn, { method:'HEAD' }); if (r && r.status===200) return fn; }catch(e){} } return null; }
  async function buildMapping(baseUrl, notes){ const map={}; for (const n of notes){ try{ const fn = await findSampleName(baseUrl, n); if (fn) map[n]=fn; }catch(e){ console.warn('map err', e); } } return map; }

  async function loadMelodySampler(instr, notes){ samplerReady=false; if (melodySampler){ try{ melodySampler.dispose(); }catch(e){} melodySampler=null; } const folder=instrMap[instr]||instr; const baseUrl=SF_BASE+folder+'-mp3/'; setStatus('멜로디 샘플 확인 중...','loading'); const urls = await buildMapping(baseUrl, notes); if (!urls || Object.keys(urls).length===0){ setStatus('멜로디 샘플 없음(합성기 폴백)','err'); return; } setStatus('멜로디 샘플 로드 중...','loading'); melodySampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl, onload: ()=>{ samplerReady=true; setStatus('멜로디 샘플 준비','ok'); }, onerror:(e)=>{ console.warn('melody sampler error', e); setStatus('멜로디 샘플 오류(폴백)','err'); } }).toDestination(); }

  async function loadAccompSampler(instr, notes){ accompReady=false; if (accompSampler){ try{ accompSampler.dispose(); }catch(e){} accompSampler=null; } if (instr==='none') return; const folder=instrMap[instr]||instr; const baseUrl=SF_BASE+folder+'-mp3/'; setStatus('반주 샘플 확인 중...','loading'); const urls = await buildMapping(baseUrl, notes.length>0?notes:['C4','E4','G4']); if (!urls || Object.keys(urls).length===0){ setStatus('반주 샘플 없음(반주는 무음)','err'); return; } setStatus('반주 샘플 로드 중...','loading'); accompSampler = new Tone.Sampler({ urls: urls, baseUrl: baseUrl, onload: ()=>{ accompReady=true; setStatus('반주 샘플 준비','ok'); }, onerror:(e)=>{ console.warn('accomp sampler error', e); setStatus('반주 샘플 오류(무음)','err'); } }); accompSampler.connect(new Tone.Gain(0.35).toDestination()); }

  // Recommendations (avoid repeats, rhythmic variety)
  const recState={ lastNoteSig:null, melodyHistory:[] };
  function recommendNoteForCurrentMeasure(){ const key=document.getElementById('keySelect').value; const scale=SCALES[key]; const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE); if (idx<0) return null; let prev=null; for (let i=0;i<NUM_MEASURES;i++) if (measures[i].length>0) prev=measures[i][measures[i].length-1]; let baseIdx=Math.floor(scale.length/2); if (prev && prev.pitch){ const pidx=scale.findIndex(s=>s.play===prev.pitch.play); if (pidx>=0) baseIdx=pidx; } const step = (Math.random()<0.75)?(Math.floor(Math.random()*3)-1):(Math.floor(Math.random()*5)-2); let cand = Math.max(0, Math.min(scale.length-1, baseIdx+step)); const durPool=['q','q','h','q','8']; let dur=durPool[Math.floor(Math.random()*durPool.length)]; if (Math.random()<0.08) return { note:null, dur }; const candidate=scale[cand]; const sig=candidate.play+':'+dur; if (recState.lastNoteSig===sig){ cand = Math.max(0, Math.min(scale.length-1, cand + (Math.random()<0.5?-1:1))); } recState.lastNoteSig = scale[cand].play+':'+dur; return { note: scale[cand], dur }; }
  function recommendMelodyForCurrentMeasure(){ const key=document.getElementById('keySelect').value; const scale=SCALES[key]; const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE); if (idx<0) return null; let remaining = BEATS_PER_MEASURE - measures[idx].reduce((s,n)=>s+n.beats,0); let startIdx=Math.floor(scale.length/2); for (let i=0;i<NUM_MEASURES;i++) if (measures[i].length>0) startIdx = Math.max(0, Math.min(scale.length-1, scale.findIndex(s=>s.play===measures[i][measures[i].length-1].pitch.play) || startIdx)); const chordMode=document.getElementById('accompChordMode').value; const chordRoot = (idx>0)?chooseChordRootForMeasure(idx-1, chordMode):null; const chordNotes = chordRoot?triad(chordRoot, currentOctave):null; const pattern=[]; const durPool=['q','q','h','q','8','q','8']; while (remaining>0){ let dur = durPool[Math.floor(Math.random()*durPool.length)]; if (beatValue[dur] > remaining){ const small = durPool.find(d=>beatValue[d] <= remaining); if (small) dur=small; else break; } let chosen=null; if (chordNotes && Math.random()<0.6){ const pick = chordNotes[Math.floor(Math.random()*chordNotes.length)]; const base = scale.findIndex(s=>s.play.startsWith(pick.slice(0,-1))); if (base>=0) chosen = scale[base]; } if (!chosen){ const move = (Math.random()<0.8)?(Math.floor(Math.random()*3)-1):(Math.floor(Math.random()*5)-2); startIdx = Math.max(0, Math.min(scale.length-1, startIdx+move)); chosen = scale[startIdx]; } if (Math.random()<0.12){ pattern.push({note:null,dur}); remaining -= beatValue[dur]; continue; } const sig = (chosen?chosen.play:'r')+':'+dur; if (recState.melodyHistory.includes(sig)){ const idxn = scale.findIndex(s=>s.play===chosen.play); const nidx = Math.max(0, Math.min(scale.length-1, idxn + (Math.random()<0.5?-1:1))); chosen = scale[nidx]; } pattern.push({note:chosen,dur}); remaining -= beatValue[dur]; } const signature = pattern.map(p => (p.note?p.note.play:'r')+'-'+p.dur).join('|'); recState.melodyHistory.push(signature); if (recState.melodyHistory.length>8) recState.melodyHistory.shift(); return pattern; }

  // UI bindings
  function attachUI(){ document.querySelectorAll('.solfeggio button[data-solf]').forEach(btn=>{ btn.removeEventListener('click', solfClick); btn.addEventListener('click', solfClick); }); function solfClick(e){ const map={do:0,re:1,mi:2,fa:3,sol:4,la:5,si:6}; const deg=map[e.currentTarget.getAttribute('data-solf')]; const key=document.getElementById('keySelect').value; const scale=SCALES[key]; const base = scale[Math.max(0,Math.min(scale.length-1,deg))]; const oct = Math.max(MIN_OCTAVE, Math.min(MAX_OCTAVE, currentOctave)); const cand = { display:{ s: base.display.s, a: base.display.a, o: oct }, play: base.play.replace(/\d$/, String(oct)) }; const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE); if (idx<0){ flash('빈 마디가 없습니다'); return; } addNoteToMeasure(idx, cand, selectedDur, false); } document.getElementById('octUp').addEventListener('click', ()=>{ if (currentOctave<MAX_OCTAVE) currentOctave++; document.getElementById('octDisplay').textContent=currentOctave; }); document.getElementById('octDown').addEventListener('click', ()=>{ if (currentOctave>MIN_OCTAVE) currentOctave--; document.getElementById('octDisplay').textContent=currentOctave; }); }

  // durations and rest active state
  let selectedDur='q', selectedIsRest=false;
  function setActiveButtons(){ document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active')); if (selectedIsRest){ const el=document.getElementById('rest_'+selectedDur); if (el) el.classList.add('active'); } else { const el=document.getElementById('dur_'+selectedDur); if (el) el.classList.add('active'); } }
  ['w','h','q','8'].forEach(d=>{ const el=document.getElementById('dur_'+d); if (el) el.addEventListener('click', ()=>{ selectedIsRest=false; selectedDur=d; setActiveButtons(); }); const r=document.getElementById('rest_'+d); if (r) r.addEventListener('click', ()=>{ selectedIsRest=true; selectedDur=d; setActiveButtons(); }); });
  setActiveButtons();

  // Recommend handlers
  document.getElementById('recommendNoteBtn').addEventListener('click', async ()=>{ try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){} const rec=recommendNoteForCurrentMeasure(); if (!rec){ flash('빈 마디가 없습니다'); return; } const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE); if (rec.note===null) addNoteToMeasure(idx, { display:{ s:'b', a:'', o:4 }, play:'' }, rec.dur, true); else addNoteToMeasure(idx, rec.note, rec.dur, false); });
  document.getElementById('recommendMelodyBtn').addEventListener('click', async ()=>{ try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){} const pattern=recommendMelodyForCurrentMeasure(); if (!pattern || pattern.length===0){ flash('추천 멜로디 생성 불가'); return; } const idx = measures.findIndex(m=>m.reduce((s,n)=>s+n.beats,0) < BEATS_PER_MEASURE); if (idx<0){ flash('빈 마디가 없습니다'); return; } for (const p of pattern){ if (p.note===null) addNoteToMeasure(idx, { display:{ s:'b', a:'', o:4 }, play:'' }, p.dur, true); else addNoteToMeasure(idx, p.note, p.dur, false); } setStatus('추천 멜로디 적용','ok'); });

  // Play/Stop UI
  document.getElementById('playBtn').addEventListener('click', async ()=>{ try{ await Tone.start(); if (Tone.context && Tone.context.state==='suspended') await Tone.context.resume(); }catch(e){} tempo = parseInt(document.getElementById('tempoInput').value) || 100; const uniq=new Set(); for (const m of measures) for (const n of m) if (!n.isRest && n.pitch && n.pitch.play) uniq.add(n.pitch.play); const used=Array.from(uniq); const instr=document.getElementById('instrSelect').value; const accomp=document.getElementById('accompSelect').value; setStatus('샘플 준비 중...','loading'); try{ await loadMelodySampler(instr, used); await loadAccompSampler(accomp, used); }catch(e){ console.warn('sample load issue', e); } const start=Date.now(); while (used.length>0 && !samplerReady && (Date.now()-start) < 4000) await new Promise(r=>setTimeout(r,120)); const start2=Date.now(); while (accomp!=='none' && accompSampler && !accompReady && (Date.now()-start2) < 3000) await new Promise(r=>setTimeout(r,120)); setStatus('샘플 준비 완료 (반주: '+(accompReady?'실음':'무음')+')','ok'); scheduleAllAndStart(); });
  document.getElementById('stopBtn').addEventListener('click', ()=>{ try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){} try{ if (synthPrimary){ synthPrimary.releaseAll(); synthPrimary.dispose(); } }catch(e){} initSynth(); setStatus('정지','ok'); });

  // Save/Load/Export
  document.getElementById('saveJsonBtn').addEventListener('click', ()=>{ try{ const obj={ key:document.getElementById('keySelect').value, measures, tempo:parseInt(document.getElementById('tempoInput').value)||100 }; const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='활동내용.json'; a.click(); URL.revokeObjectURL(url); setStatus('저장 완료','ok'); }catch(e){ console.warn(e); flash('저장 실패'); } });
  document.getElementById('loadJsonBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', ev=>{ const f=ev.target.files[0]; if (!f) return; const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); if (!obj.measures) throw 'invalid'; for (let i=0;i<NUM_MEASURES && i<obj.measures.length;i++) measures[i]=obj.measures[i]; if (obj.key) document.getElementById('keySelect').value=obj.key; if (obj.tempo) document.getElementById('tempoInput').value=obj.tempo; renderAll(); setStatus('불러오기 완료','ok'); }catch(e){ console.warn(e); alert('불러오기 실패'); } }; r.readAsText(f); ev.target.value=''; });

  document.getElementById('exportPngBtn').addEventListener('click', ()=>{ try{ // export SVG of first renderer (simple approach)
      const svgs = document.querySelectorAll('#score-container svg'); if (svgs.length===0){ flash('악보가 없어 저장할 수 없습니다'); return; } const svg = svgs[0].outerHTML; const blob = new Blob([svg], { type: 'image/svg+xml' }); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='score.svg'; a.click(); URL.revokeObjectURL(url); setStatus('악보 저장 완료','ok'); }catch(e){ console.warn(e); flash('악보 저장 실패'); } });

  document.getElementById('exportMidiBtn').addEventListener('click', ()=>{ try{ const midi = new Midi(); const track = midi.addTrack(); const tempoVal = parseInt(document.getElementById('tempoInput').value)||100; midi.header.setTempo(tempoVal); let time=0; const secPerBeat=60/tempoVal; for (let m=0;m<NUM_MEASURES;m++){ for (const n of measures[m]){ const dur = n.beats * secPerBeat; if (!n.isRest) track.addNote({ name:n.pitch.play, time:time, duration:dur, velocity:0.9 }); time += dur; } } const arr=midi.toArray(); const blob=new Blob([arr],{type:'audio/midi'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='나의_음악.mid'; a.click(); URL.revokeObjectURL(url); setStatus('MIDI 생성 완료','ok'); }catch(e){ console.warn(e); flash('MIDI 생성 실패'); } });

  // Clear all button (ensure bound)
  function bindClearAll(){ const btn=document.getElementById('clearAllBtn'); if (!btn) return; const newBtn = btn.cloneNode(true); btn.parentNode.replaceChild(newBtn, btn); newBtn.addEventListener('click', ()=>{ if (!confirm('전체 악보를 지우시겠습니까?')) return; const prev = JSON.parse(JSON.stringify(measures)); for (let i=0;i<measures.length;i++) measures[i]=[]; history.push({ type:'clearAll', prev }); try{ localStorage.removeItem('composer_autosave'); }catch(e){} try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(_){} renderAll(); setStatus('전체 초기화 완료','ok'); }); }

  // Expose clearMeasure globally for inline buttons
  window.clearMeasure = function(i){ if (!Number.isFinite(i)) return; if (!confirm((i+1)+'마디를 지우시겠습니까?')) return; const prev = JSON.parse(JSON.stringify(measures[i])); measures[i]=[]; history.push({ type:'clear', measure:i, prev }); renderAll(); };

  // attach measure delete handlers already done in renderAll

  // initial setup after VexFlow ready
  async function initApp(){ try{ const ok = await waitForVex(8000); if (!ok){ setStatus('악보 엔진 로드 실패 — 네트워크 확인','err'); return; } buildRenderAll(); renderAll(); attachUI(); bindClearAll(); setStatus('준비 완료 — 악보를 추가하고 Play로 재생하세요. (첫 재생은 버튼 클릭으로 오디오 허용 필요)','ok'); }catch(e){ console.error('initApp error', e); setStatus('초기화 오류: '+(e.message||e),'err'); } }

  // start
  document.addEventListener('DOMContentLoaded', ()=>{ initApp(); });

})();
</script>

<script>
(function(){
  if (window.__patchApplied) return;
  window.__patchApplied = true;

  // If window.history was overwritten as an Array, preserve it as __composerHistory and shim push/pop
  try{
    if (Array.isArray(window.history) && typeof window.history.pushState !== 'function'){
      window.__composerHistory = window.history.slice();
      try{ delete window.history; }catch(e){}
      window.__composerHistory = window.__composerHistory || [];
      if (typeof window.history !== 'object') window.history = window.history || {};
      if (typeof window.history.push !== 'function') window.history.push = function(){ return window.__composerHistory.push.apply(window.__composerHistory, arguments); };
      if (typeof window.history.pop !== 'function') window.history.pop = function(){ return window.__composerHistory.pop.apply(window.__composerHistory, arguments); };
    }
  }catch(e){ console.warn('history shim error', e); }

  // Safer attachMeasureHandlersAll override
  window.attachMeasureHandlersAll = function attachMeasureHandlersAll(){
    if (window.__attachHandlersInstalled) return;
    window.__attachHandlersInstalled = true;
    var scaleKeys = window.currentScaleKeys || ['c/6','b/5','a/5','g/5','f/5','e/5','d/5','c/5','b/4','a/4','g/4','f/4','e/4','d/4','c/4'];
    function idxFromKey(key){ var i = scaleKeys.indexOf(key); return i>=0?i:Math.floor(scaleKeys.length/2); }
    function keyFromIndex(i){ return scaleKeys[Math.max(0, Math.min(scaleKeys.length-1, i))]; }
    function yToIndex(el, clientY){ var r = el.getBoundingClientRect(); var y = clientY - r.top; var idx = Math.floor((y / r.height) * scaleKeys.length); return Math.max(0, Math.min(scaleKeys.length-1, idx)); }
    var boxes = document.querySelectorAll('.measure-box, .measure');
    boxes.forEach(function(box, mIdx){
      if (box.dataset.handlersAttached === '1') return;
      box.dataset.handlersAttached = '1';
      // Click to add note/rest
      box.addEventListener('click', function(ev){
        if (ev.target.closest('button, input, a')) return;
        try{
          var isRest = !!window.selectedIsRest;
          var dur = window.selectedDur || 'q';
          var pitch = window.selectedNoteKey || keyFromIndex(Math.floor(scaleKeys.length/2));
          if (typeof window.addNoteToMeasure === 'function'){
            if (isRest) window.addNoteToMeasure(mIdx, null, dur, true);
            else window.addNoteToMeasure(mIdx, { keys: [pitch] }, dur, false);
          } else {
            window.measures = window.measures || [];
            window.measures[mIdx] = window.measures[mIdx] || [];
            window.measures[mIdx].push({ key: pitch, duration: dur, isRest: !!isRest });
            if (typeof window.renderAll === 'function') window.renderAll();
          }
          window.__composerHistory = window.__composerHistory || [];
          window.__composerHistory.push({ type:'add', measure: mIdx });
        }catch(e){ console.error('click add failed', e); }
      });

      // Drag to adjust pitch smoothly
      box.addEventListener('mousedown', function(ev){
        if (ev.target.closest('button, input, a')) return;
        var raf = null;
        function onMove(e){
          var targetIdx = yToIndex(box, e.clientY);
          var m = window.measures && window.measures[mIdx];
          if (!m || m.length === 0) return;
          var last = m[m.length-1];
          if (!last) return;
          if (raf) cancelAnimationFrame(raf);
          function step(){
            var curr = idxFromKey(last.key || scaleKeys[Math.floor(scaleKeys.length/2)]);
            if (curr === targetIdx) return;
            var next = curr < targetIdx ? curr+1 : curr-1;
            last.key = keyFromIndex(next);
            if (typeof window.renderAll === 'function') window.renderAll();
            if (next !== targetIdx) raf = requestAnimationFrame(step);
          }
          raf = requestAnimationFrame(step);
        }
        function onUp(){ window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); if (raf){ cancelAnimationFrame(raf); raf = null; } }
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
    });
  };

  // Wrap renderAll safely once
  try{
    if (typeof window.renderAll === 'function' && !window.__renderAllWrapped){
      window.__renderAllWrapped = true;
      var origRenderAll = window.renderAll;
      window.renderAll = function(){
        var res = origRenderAll.apply(this, arguments);
        try{ window.attachMeasureHandlersAll(); }catch(e){ console.error('attach after render failed', e); }
        return res;
      };
    }
  }catch(e){ console.error(e); }

  // Undo button binding
  try{
    var undoBtn = document.getElementById('undoBtn') || document.querySelector('[data-action="undo"]');
    if (undoBtn){
      try{ undoBtn.removeEventListener('click', undoBtn.__handler); }catch(e){}
      undoBtn.__handler = function(){
        window.__composerHistory = window.__composerHistory || [];
        var last = window.__composerHistory.pop();
        if (!last){ if (typeof setStatus === 'function') setStatus('취소할 작업이 없습니다','warn'); return; }
        if (last.type === 'add'){
          if (window.measures && window.measures[last.measure]) window.measures[last.measure].pop();
        } else if (last.type === 'clear'){
          if (last.prev) window.measures[last.measure] = last.prev;
        } else if (last.type === 'clearAll'){
          if (last.prev) window.measures = last.prev;
        }
        if (typeof window.renderAll === 'function') window.renderAll();
      };
      undoBtn.addEventListener('click', undoBtn.__handler);
    }
  }catch(e){ console.error('undo bind failed', e); }

  // Rate-limited unhandledrejection handler
  try{
    window.addEventListener('unhandledrejection', function(e){
      try{
        var msg = (e && e.reason && e.reason.message) ? e.reason.message : String(e.reason || '');
        if (!window.__lastUnhandled || (Date.now() - window.__lastUnhandled) > 10000){
          console.error('Unhandled rejection:', e.reason || e);
          window.__lastUnhandled = Date.now();
          if (typeof setStatus === 'function') setStatus('비동기 오류: '+msg, 'err');
        }
      }catch(err){ console.error(err); }
    });
  }catch(e){ console.error('register unhandledrejection failed', e); }

})();
</script>
